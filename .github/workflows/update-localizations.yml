                  "accountDeletionDialogMessage": "アカウントと関連データを完全に削除してもよろしいですか？",
                  "accountDeletionCancel": "キャンセル",
                  "accountDeletionConfirm": "アカウントを削除",
                  "accountDeletionSuccess": "アカウントが正常に削除されました。",
                  "accountDeletionFailed": "アカウントの削除に失敗しました。もう一度お試しください。"
              }
          }

          base = Path("lib/localization/languages")

          for lang, values in translations.items():
              path = base / f"{lang}.dart"

              if not path.exists():
                  raise FileNotFoundError(path)

              content = path.read_text(encoding="utf-8")

              for key, value in values.items():
                  key_pattern = f"'{key}':"

                  if key_pattern in content:
                      continue

                  escaped = (
                      value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                  )

                  entry = (
                      f"\n  '{key}':\n"
                      f"      '{escaped}',\n"
                  )

                  marker = "\n};"

                  if marker not in content:
                      raise RuntimeError(
                          f"Could not find map end in {path}"
                      )

                  content = content.replace(
                      marker,
                      "\n  // ============================================================\n"
                      "  // 🌍 ACCOUNT / UI ADDITIONS\n"
                      "  // ============================================================\n"
                      + entry
                      + marker,
                      1,
                  )

              path.write_text(content, encoding="utf-8")
              print(f"Updated {path}")

      - name: Verify localization files
        shell: python
        run: |
          from pathlib import Path

          required = [
              "referrals",
              "deleteAccount",
              "accountDeletion",
              "accountDeletionTitle",
              "accountDeletionSubtitle",
              "deleteYourAccount",
              "deleteAccountDescription",
              "deleteAccountButton",
              "cannotAccessApp",
              "cannotAccessAppDescription",
              "openAccountDeletionPage",
              "accountDeletionPermanent",
              "accountDeletionDialogTitle",
              "accountDeletionDialogMessage",
              "accountDeletionCancel",
              "accountDeletionConfirm",
              "accountDeletionSuccess",
              "accountDeletionFailed",
          ]

          base = Path("lib/localization/languages")

          for path in sorted(base.glob("*.dart")):
              content = path.read_text(encoding="utf-8")

              missing = [
                  key
                  for key in required
                  if f"'{key}':" not in content
              ]

              if missing:
                  raise RuntimeError(
                      f"{path} is missing: {', '.join(missing)}"
                  )

              print(f"OK: {path}")

      - name: Commit localization updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib/localization/languages/*.dart

          if git diff --cached --quiet; then
            echo "No localization changes required."
            exit 0
          fi

          git commit -m "Update all Stelluriini localization files"
          git push