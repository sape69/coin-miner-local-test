name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      # ==========================================================
      # SAVE FIREBASE
      # ==========================================================

      - name: Save Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json /tmp/google-services.json

          echo "Firebase configuration saved."

      # ==========================================================
      # CREATE CLEAN FLUTTER ANDROID PROJECT
      # ==========================================================

      - name: Create clean Flutter Android project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --project-name stelluriini \
            --org com.example \
            .

      # ==========================================================
      # RESTORE FIREBASE
      # ==========================================================

      - name: Restore Firebase configuration
        run: |
          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

          echo "Firebase configuration restored."

      # ==========================================================
      # ANDROID GRADLE PLUGIN 8.1.1
      # ==========================================================

      - name: Set Android Gradle Plugin version
        run: |
          sed -i \
            's/com.android.application" version "[^"]*"/com.android.application" version "8.1.1"/' \
            android/settings.gradle

          echo "Android Gradle Plugin:"
          grep 'com.android.application' android/settings.gradle

      # ==========================================================
      # ANDROID PACKAGE
      # ==========================================================

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'namespace = "com.example.stelluriini"',
              'namespace = "com.example.stelluriini"'
          )

          text = text.replace(
              'applicationId = "com.example.stelluriini"',
              'applicationId = "com.example.stelluriini"'
          )

          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace(
                  'id "dev.flutter.flutter-gradle-plugin"',
                  'id "dev.flutter.flutter-gradle-plugin"\n'
                  '    id "com.google.gms.google-services"'
              )

          path.write_text(text)
          PY

      # ==========================================================
      # FIREBASE GOOGLE SERVICES PLUGIN
      # ==========================================================

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")
          text = path.read_text()

          if 'com.google.gms.google-services' not in text:

              marker = 'id "org.jetbrains.kotlin.android"'

              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if marker in line:
                      lines.insert(
                          i + 1,
                          '    id "com.google.gms.google-services" '
                          'version "4.4.3" apply false'
                      )
                      break
              else:
                  raise SystemExit(
                      "Kotlin Android plugin not found"
                  )

              text = "\n".join(lines) + "\n"

          path.write_text(text)
          PY

      # ==========================================================
      # VERIFY FIREBASE
      # ==========================================================

      - name: Verify Firebase configuration
        run: |
          echo "Firebase package:"
          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Android applicationId:"
          grep -n "applicationId" \
            android/app/build.gradle

      # ==========================================================
      # STELLURIINI ICON
      # ==========================================================

      - name: Check Stelluriini icon
        run: |
          test -f stelluriini_icon.png

          echo "Stelluriini icon found."

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert stelluriini_icon.png \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # ==========================================================
      # APP NAME
      # ==========================================================

      - name: Set application name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="Stelluriini"/' \
            android/app/src/main/AndroidManifest.xml

      # ==========================================================
      # FLUTTER PACKAGES
      # ==========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # REMOVE GENERATED TEST
      # ==========================================================

      - name: Remove generated Flutter tests
        run: |
          rm -rf test

      # ==========================================================
      # ANALYZE
      # ==========================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Build Stelluriini APK
        run: |
          mkdir -p build

          flutter build apk --release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

          echo "========================================"
          echo "STELLURIINI APK CREATED SUCCESSFULLY"
          echo "========================================"

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk