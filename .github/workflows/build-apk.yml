name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. Setup Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Verify Android SDK
      # ==========================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo ""
          echo "===== SDKMANAGER VERSION ====="
          "$SDKMANAGER" --version

      # ==========================================================
      # 5. Install Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      # ==========================================================
      # 6. Verify Flutter project
      # ==========================================================
      - name: Verify Flutter project
        run: |
          echo "===== PROJECT ROOT ====="
          pwd

          echo ""
          echo "===== TOP LEVEL ====="
          ls -la

          echo ""
          echo "===== ANDROID DIRECTORY ====="

          find android \
            -maxdepth 5 \
            -type f \
            | sort

      # ==========================================================
      # 7. Verify Firebase configuration
      # ==========================================================
      - name: Verify Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 8. Diagnose Android manifests
      # ==========================================================
      - name: Diagnose Android manifests
        run: |
          echo ""
          echo "=================================================="
          echo "ANDROID MANIFEST DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== ALL MANIFEST FILES ====="

          find android \
            -type f \
            -name "AndroidManifest.xml" \
            -print \
            | sort

          echo ""
          echo "===== MANIFEST CONTENTS ====="

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"

            cat "$file"

          done < <(
            find android \
              -type f \
              -name "AndroidManifest.xml" \
              -print \
              | sort
          )

      # ==========================================================
      # 9. Search Flutter V1 references
      # ==========================================================
      - name: Diagnose Flutter V1 references
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER V1 REFERENCE SEARCH"
          echo "=================================================="

          echo ""
          echo "===== SEARCH android/ FOR io.flutter.app ====="

          if grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "io.flutter.app" \
            android 2>/dev/null; then

            echo ""
            echo "WARNING: Flutter V1 reference found in android/."

          else

            echo "No io.flutter.app references found in android/."

          fi

          echo ""
          echo "===== SEARCH ENTIRE REPOSITORY FOR io.flutter.app ====="

          if grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            "io.flutter.app" \
            . 2>/dev/null; then

            echo ""
            echo "WARNING: Flutter V1 reference found somewhere in repository."

          else

            echo "No io.flutter.app references found in repository."

          fi

      # ==========================================================
      # 10. Diagnose flutterEmbedding
      # ==========================================================
      - name: Diagnose flutterEmbedding metadata
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER EMBEDDING SEARCH"
          echo "=================================================="

          echo ""
          echo "===== SEARCH FOR flutterEmbedding ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "flutterEmbedding" \
            android 2>/dev/null || true

          echo ""
          echo "===== SEARCH FOR EMBEDDING VALUE 1 ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="1"' \
            android 2>/dev/null || true

          echo ""
          echo "===== SEARCH FOR EMBEDDING VALUE 2 ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="2"' \
            android 2>/dev/null || true

      # ==========================================================
      # 11. Diagnose MainActivity
      # ==========================================================
      - name: Diagnose MainActivity
        run: |
          echo ""
          echo "=================================================="
          echo "MAIN ACTIVITY DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== MAIN ACTIVITY FILES ====="

          find android/app/src \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o \
              -name "MainActivity.java" \
            \) \
            -print \
            | sort

          echo ""
          echo "===== MAIN ACTIVITY CONTENT ====="

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"

            cat "$file"

          done < <(
            find android/app/src \
              -type f \
              \( \
                -name "MainActivity.kt" \
                -o \
                -name "MainActivity.java" \
              \) \
              -print \
              | sort
          )

      # ==========================================================
      # 12. Diagnose Flutter
      # ==========================================================
      - name: Diagnose Flutter project
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER PROJECT DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== FLUTTER VERSION ====="

          flutter --version

          echo ""
          echo "===== DART VERSION ====="

          dart --version

          echo ""
          echo "===== FLUTTER DOCTOR ====="

          flutter doctor -v

      # ==========================================================
      # 13. Diagnose Gradle
      # ==========================================================
      - name: Diagnose Gradle configuration
        run: |
          echo ""
          echo "=================================================="
          echo "GRADLE DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== android/settings.gradle ====="

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/settings.gradle.kts ====="

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/build.gradle ====="

          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/build.gradle.kts ====="

          if [ -f android/build.gradle.kts ]; then
            cat android/build.gradle.kts
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/app/build.gradle ====="

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/app/build.gradle.kts ====="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            echo "File not found."
          fi

      # ==========================================================
      # 14. Configure AndroidX
      # ==========================================================
      - name: Configure AndroidX
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^android.useAndroidX=true" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          echo ""
          echo "===== android/gradle.properties ====="

          cat android/gradle.properties

      # ==========================================================
      # 15. Flutter clean
      # ==========================================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 16. Flutter pub get
      # ==========================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 17. Flutter analyze
      # ==========================================================
      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 18. Final Android embedding diagnostics
      # ==========================================================
      - name: Final Android embedding diagnostics
        run: |
          echo ""
          echo "=================================================="
          echo "FINAL CHECK BEFORE FLUTTER BUILD"
          echo "=================================================="

          echo ""
          echo "===== ALL ANDROID MANIFESTS ====="

          find android \
            -type f \
            -name "AndroidManifest.xml" \
            -print \
            | sort

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"

            cat "$file"

          done < <(
            find android \
              -type f \
              -name "AndroidManifest.xml" \
              -print \
              | sort
          )

          echo ""
          echo "===== FLUTTER V1 SEARCH ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "io.flutter.app" \
            android 2>/dev/null || true

          echo ""
          echo "===== FLUTTER EMBEDDING SEARCH ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "flutterEmbedding" \
            android 2>/dev/null || true

          echo ""
          echo "===== MAIN ACTIVITY SEARCH ====="

          find android/app/src \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o \
              -name "MainActivity.java" \
            \) \
            -print \
            | sort

          echo ""
          echo "=================================================="
          echo "END OF FINAL DIAGNOSTICS"
          echo "=================================================="

      # ==========================================================
      # 19. Verbose APK build
      # ==========================================================
      - name: Build release APK - verbose diagnostics
        shell: bash
        run: |
          set +e

          echo ""
          echo "=================================================="
          echo "FLUTTER VERBOSE APK BUILD"
          echo "=================================================="

          flutter build apk --release -v 2>&1 | tee flutter_build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=================================================="
          echo "SEARCHING BUILD LOG"
          echo "=================================================="

          echo ""
          echo "--- Android embedding references ---"

          grep -ni -E \
            "embedding|FlutterActivity|FlutterApplication|AndroidManifest|project.dart|v1|v2" \
            flutter_build.log \
            | tail -200 || true

          echo ""
          echo "--- Manifest references ---"

          grep -ni -E \
            "AndroidManifest.xml|flutterEmbedding" \
            flutter_build.log \
            | tail -100 || true

          echo ""
          echo "--- Final Flutter error ---"

          grep -ni -E \
            "Build failed due to use of deleted Android v1 embedding|FAILURE|ERROR|Exception" \
            flutter_build.log \
            | tail -100 || true

          echo ""
          echo "Flutter build exit code: $BUILD_EXIT"

          exit "$BUILD_EXIT"

      # ==========================================================
      # 20. Upload verbose Flutter build log
      # ==========================================================
      - name: Upload Flutter build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-diagnostics
          path: flutter_build.log
          if-no-files-found: ignore

      # ==========================================================
      # 21. Verify APK
      # ==========================================================
      - name: Verify APK
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 22. Upload APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error