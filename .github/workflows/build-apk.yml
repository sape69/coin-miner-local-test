name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Regenerate Android project
        run: flutter create --platforms=android .

      - name: Fix Android build configuration
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------
          # android/settings.gradle
          # -------------------------------------------------

          path = Path("android/settings.gradle")
          text = path.read_text()

          # Android Gradle Plugin
          text = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.1.1\g<2>',
              text
          )

          # Kotlin plugin
          text = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>1.9.24\g<2>',
              text
          )

          path.write_text(text)

          # -------------------------------------------------
          # android/app/build.gradle
          # -------------------------------------------------

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # New Flutter syntax
          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          # Old Flutter syntax
          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          # If minSdk is missing, insert it
          if not re.search(r'\bminSdk(?:Version)?\s*[=:]\s*23\b', text):
              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdk = 23",
                  1
              )

          path.write_text(text)

          PY

          echo ""
          echo "======================================"
          echo "settings.gradle"
          echo "======================================"
          cat android/settings.gradle

          echo ""
          echo "======================================"
          echo "Kotlin plugin"
          echo "======================================"
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle || true

          echo ""
          echo "======================================"
          echo "Android Gradle plugin"
          echo "======================================"
          grep -n "com.android.application" android/settings.gradle || true

          echo ""
          echo "======================================"
          echo "minSdk"
          echo "======================================"
          grep -n "minSdk" android/app/build.gradle || true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-miner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
