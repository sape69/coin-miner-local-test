name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Stelluriini Android APK
    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # FLUTTER
      # ========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ========================================================
      # JAVA
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      # ========================================================
      # BASIC PROJECT CHECK
      # ========================================================

      - name: Verify Flutter project
        run: |
          echo "========================================"
          echo "VERIFY FLUTTER PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "Flutter project found."

      # ========================================================
      # FIREBASE CHECK
      # ========================================================

      - name: Verify Firebase configuration
        run: |
          echo "========================================"
          echo "VERIFY FIREBASE"
          echo "========================================"

          if [ -f "android/app/google-services.json" ]; then
            echo "google-services.json FOUND."
          else
            echo "ERROR: google-services.json NOT FOUND."
            exit 1
          fi

      # ========================================================
      # STELLA LOGO CHECK
      # ========================================================

      - name: Verify Stelluriini assets
        run: |
          echo "========================================"
          echo "VERIFY STELLURIINI ASSETS"
          echo "========================================"

          if [ -d "assets" ]; then
            echo "assets folder FOUND."
          else
            echo "WARNING: assets folder not found."
          fi

      # ========================================================
      # MAIN ACTIVITY CHECK
      # ========================================================

      - name: Verify MainActivity
        run: |
          echo "========================================"
          echo "VERIFY MAIN ACTIVITY"
          echo "========================================"

          MAIN_ACTIVITY="android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt NOT FOUND."
            exit 1
          fi

          cat "$MAIN_ACTIVITY"

          if grep -q 'io.flutter.embedding.android.FlutterActivity' "$MAIN_ACTIVITY"; then
            echo "FlutterActivity v2 FOUND."
          else
            echo "ERROR: FlutterActivity v2 NOT FOUND."
            exit 1
          fi

          echo "MainActivity check PASSED."

      # ========================================================
      # ANDROID MANIFEST CHECK
      # ========================================================

      - name: Verify Android Manifest
        run: |
          echo "========================================"
          echo "VERIFY ANDROID MANIFEST"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml NOT FOUND."
            exit 1
          fi

          echo ""
          echo "Manifest path:"
          realpath "$MANIFEST"

          echo ""
          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"

          echo ""
          echo "===== flutterEmbedding ====="

          grep -n -C 3 "flutterEmbedding" "$MANIFEST" || true

          echo ""
          echo "===== Embedding checks ====="

          if grep -q 'flutterEmbedding' "$MANIFEST"; then
            echo "flutterEmbedding text FOUND."
          else
            echo "ERROR: flutterEmbedding text NOT FOUND."
            exit 1
          fi

          if grep -q 'android:value="2"' "$MANIFEST"; then
            echo "flutterEmbedding value 2 FOUND."
          else
            echo "ERROR: flutterEmbedding value 2 NOT FOUND."
            exit 1
          fi

          if grep -q 'io.flutter.app.FlutterApplication' "$MANIFEST"; then
            echo "ERROR: Old FlutterApplication FOUND."
            exit 1
          else
            echo "No old FlutterApplication found."
          fi

          echo ""
          echo "Android Manifest check PASSED."

      # ========================================================
      # ANDROIDX
      # ========================================================

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      # ========================================================
      # FLUTTER CLEAN
      # ========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ========================================================
      # GET DEPENDENCIES
      # ========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ========================================================
      # LAUNCHER ICONS
      # ========================================================

      - name: Generate launcher icons
        run: |
          dart run flutter_launcher_icons

      # ========================================================
      # REMOVE OLD TEST PAGE IF PRESENT
      # ========================================================

      - name: Remove temporary test pages
        run: |
          if [ -f "lib/pages/minimal_test_page.dart" ]; then
            echo "Removing temporary MinimalTestPage..."
            rm -f "lib/pages/minimal_test_page.dart"
          fi

      # ========================================================
      # FLUTTER ANALYZE
      # ========================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ========================================================
      # FINAL ANDROID EMBEDDING CHECK
      #
      # TÄMÄ ON TÄRKEÄ:
      # Tarkistus tehdään VASTA juuri ennen buildia.
      # ========================================================

      - name: Final Android embedding check
        run: |
          echo "========================================"
          echo "FINAL ANDROID EMBEDDING CHECK"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo ""
          echo "Manifest path:"
          realpath "$MANIFEST"

          echo ""
          echo "Manifest exists:"
          test -f "$MANIFEST"

          echo ""
          echo "===== FINAL AndroidManifest.xml ====="
          cat "$MANIFEST"

          echo ""
          echo "===== FINAL flutterEmbedding SEARCH ====="

          grep -n -C 3 "flutterEmbedding" "$MANIFEST" || true

          echo ""
          echo "===== FINAL APPLICATION NAME ====="

          grep -n -C 2 'android:name=' "$MANIFEST" || true

          echo ""
          echo "===== FINAL EMBEDDING CHECK ====="

          if grep -q 'flutterEmbedding' "$MANIFEST"; then
            echo "flutterEmbedding text FOUND."
          else
            echo "ERROR: flutterEmbedding text NOT FOUND."
            exit 1
          fi

          if grep -q 'android:value="2"' "$MANIFEST"; then
            echo "flutterEmbedding value 2 FOUND."
          else
            echo "ERROR: flutterEmbedding value 2 NOT FOUND."
            exit 1
          fi

          if grep -q 'io.flutter.app.FlutterApplication' "$MANIFEST"; then
            echo "ERROR: Old FlutterApplication FOUND."
            exit 1
          else
            echo "No old FlutterApplication found."
          fi

          echo ""
          echo "========================================"
          echo "FINAL ANDROID EMBEDDING CHECK PASSED"
          echo "========================================"

      # ========================================================
      # BUILD APK
      # ========================================================

      - name: Build Stelluriini APK
        run: |
          flutter build apk --release

      # ========================================================
      # VERIFY APK
      # ========================================================

      - name: Verify APK
        run: |
          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$APK" ]; then
            ls -lh "$APK"
            echo "APK FOUND."
          else
            echo "ERROR: APK NOT FOUND."
            exit 1
          fi

      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk