name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      # ==========================================================
      # SAVE FIREBASE
      # ==========================================================

      - name: Save Firebase configuration
        run: |
          test -f android/app/google-services.json

          cp android/app/google-services.json \
            /tmp/google-services.json

      # ==========================================================
      # CREATE CLEAN ANDROID PROJECT
      # ==========================================================

      - name: Create clean Flutter Android project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --project-name stelluriini \
            --org com.example \
            .

      # ==========================================================
      # RESTORE FIREBASE
      # ==========================================================

      - name: Restore Firebase configuration
        run: |
          mkdir -p android/app

          cp /tmp/google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

      # ==========================================================
      # ANDROID / KOTLIN / FIREBASE
      # ==========================================================

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ------------------------------------------------------
          # settings.gradle
          # ------------------------------------------------------

          settings = Path("android/settings.gradle")
          text = settings.read_text()

          # Android Gradle Plugin 8.1.1
          text = text.replace(
              'id "com.android.application" version "8.1.0" apply false',
              'id "com.android.application" version "8.1.1" apply false'
          )

          text = text.replace(
              'id "com.android.application" version "8.1.1" apply false',
              'id "com.android.application" version "8.1.1" apply false'
          )

          # Kotlin 2.1.0
          import re

          text = re.sub(
              r'id "org\.jetbrains\.kotlin\.android" '
              r'version "[^"]+" apply false',
              'id "org.jetbrains.kotlin.android" '
              'version "2.1.0" apply false',
              text
          )

          # Firebase Google Services
          if 'com.google.gms.google-services' not in text:
              marker = 'id "org.jetbrains.kotlin.android"'

              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if marker in line:
                      lines.insert(
                          i + 1,
                          '    id "com.google.gms.google-services" '
                          'version "4.4.3" apply false'
                      )
                      break
              else:
                  raise SystemExit(
                      "Kotlin Android plugin not found"
                  )

              text = "\n".join(lines) + "\n"

          settings.write_text(text)

          # ------------------------------------------------------
          # app/build.gradle
          # ------------------------------------------------------

          app = Path("android/app/build.gradle")
          text = app.read_text()

          # Package
          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.example.stelluriini"',
              text
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.example.stelluriini"',
              text
          )

          # Firebase Auth requires minSdk 23
          text = text.replace(
              'minSdk = flutter.minSdkVersion',
              'minSdk = 23'
          )

          text = text.replace(
              'minSdk = 21',
              'minSdk = 23'
          )

          # Firebase plugin
          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace(
                  'id "dev.flutter.flutter-gradle-plugin"',
                  'id "dev.flutter.flutter-gradle-plugin"\n'
                  '    id "com.google.gms.google-services"'
              )

          app.write_text(text)
          PY

          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          grep -n \
            "namespace\|applicationId\|minSdk\|google-services" \
            android/app/build.gradle

      # ==========================================================
      # VERIFY FIREBASE
      # ==========================================================

      - name: Verify Firebase
        run: |
          echo "Firebase package:"
          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Firebase file:"
          test -f android/app/google-services.json

      # ==========================================================
      # ICON
      # ==========================================================

      - name: Check Stelluriini icon
        run: |
          test -f stelluriini_icon.png

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert stelluriini_icon.png \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # ==========================================================
      # APP NAME
      # ==========================================================

      - name: Set application name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="Stelluriini"/' \
            android/app/src/main/AndroidManifest.xml

      # ==========================================================
      # FLUTTER
      # ==========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Remove generated Flutter tests
        run: |
          rm -rf test

      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build Stelluriini APK
        run: |
          mkdir -p build

          flutter build apk --release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

          echo "========================================"
          echo "STELLURIINI APK CREATED SUCCESSFULLY"
          echo "========================================"

      # ==========================================================
      # UPLOAD
      # ==========================================================

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk