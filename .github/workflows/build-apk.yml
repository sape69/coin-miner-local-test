name: Build Stelluriini APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # FLUTTER
      # ========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # ========================================================
      # JAVA
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Configure Android SDK
        run: |
          echo "========================================"
          echo "CONFIGURING ANDROID SDK"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not set}"

          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID SDK CONFIGURATION COMPLETE"
          echo "========================================"

      - name: Install Android SDK components
        run: |
          echo "========================================"
          echo "INSTALLING ANDROID SDK COMPONENTS"
          echo "========================================"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo ""
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

          echo ""
          echo "========================================"
          echo "ANDROID SDK COMPONENTS READY"
          echo "========================================"

      # ========================================================
      # FIREBASE
      # ========================================================

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase configuration..."

          test -f android/app/google-services.json

          echo "google-services.json found."

          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Firebase configuration OK."

      # ========================================================
      # STELLURIINI LOGO
      # ========================================================

      - name: Check Stelluriini logo
        run: |
          echo "Checking logo..."

          test -f assets/images/stelluriini_logo.png

          echo "========================================"
          echo "STELLURIINI LOGO FOUND"
          echo "========================================"

      # ========================================================
      # VERIFY FLUTTER SOURCE
      # ========================================================

      - name: Verify Flutter source files
        run: |
          echo "========================================"
          echo "VERIFYING FLUTTER SOURCE FILES"
          echo "========================================"

          echo ""
          echo "===== lib/main.dart ====="
          test -f lib/main.dart
          sed -n '1,260p' lib/main.dart

          echo ""
          echo "===== lib/auth_gate.dart ====="
          test -f lib/auth_gate.dart
          sed -n '1,260p' lib/auth_gate.dart

          echo ""
          echo "===== lib/pages/login_page.dart ====="
          test -f lib/pages/login_page.dart
          sed -n '1,360p' lib/pages/login_page.dart

          echo ""
          echo "===== lib/pages/home/home_page.dart ====="
          test -f lib/pages/home/home_page.dart
          sed -n '1,260p' lib/pages/home/home_page.dart

          echo ""
          echo "Flutter source files verified."

      # ========================================================
      # CHECK OLD MINIMAL TEST
      # ========================================================

      - name: Check for old MinimalTestPage
        run: |
          echo "========================================"
          echo "CHECKING FOR OLD MINIMAL TEST"
          echo "========================================"

          if grep -q "MinimalTestPage" lib/main.dart; then
            echo ""
            echo "ERROR:"
            echo "lib/main.dart still contains MinimalTestPage."
            echo ""
            exit 1
          fi

          echo "MinimalTestPage NOT found."

      # ========================================================
      # VERIFY LOGIN PAGE
      # ========================================================

      - name: Verify LoginPage file
        run: |
          echo "========================================"
          echo "CHECKING LOGIN PAGE"
          echo "========================================"

          test -f lib/pages/login_page.dart

          echo "LoginPage file FOUND."

      # ========================================================
      # VERIFY AUTH GATE
      # ========================================================

      - name: Verify AuthGate
        run: |
          echo "========================================"
          echo "CHECKING AUTH GATE"
          echo "========================================"

          test -f lib/auth_gate.dart

          if ! grep -q "pages/home/home_page.dart" lib/auth_gate.dart; then
            echo ""
            echo "ERROR:"
            echo "AuthGate does not contain the correct HomePage import."
            echo ""
            exit 1
          fi

          if ! grep -q "HomePage(" lib/auth_gate.dart; then
            echo ""
            echo "ERROR:"
            echo "HomePage is not used by AuthGate."
            echo ""
            exit 1
          fi

          echo "AuthGate verification PASSED."

      # ========================================================
      # VERIFY ANDROID MAIN ACTIVITY
      # ========================================================

      - name: Verify Android MainActivity
        run: |
          echo "========================================"
          echo "VERIFYING MAIN ACTIVITY"
          echo "========================================"

          test -f \
            android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt

          cat \
            android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt

          echo ""
          echo "MainActivity verified."

      # ========================================================
      # VERIFY ANDROID PROJECT
      # ========================================================

      - name: Verify Android project
        run: |
          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo ""
          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo ""
          echo "===== Firebase ====="
          test -f android/app/google-services.json

          echo ""
          echo "Android project OK."

      # ========================================================
      # APPLICATION NAME
      # ========================================================

      - name: Set application name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="Stelluriini"/' \
            android/app/src/main/AndroidManifest.xml

          echo "Application name set to Stelluriini."

      # ========================================================
      # VERIFY FLUTTER ANDROID EMBEDDING
      # ========================================================

      - name: Verify Flutter Android embedding
        run: |
          echo "========================================"
          echo "VERIFYING FLUTTER ANDROID EMBEDDING"
          echo "========================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          MAIN_ACTIVITY="android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt"

          echo ""
          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"

          echo ""
          echo "===== MainActivity.kt ====="
          cat "$MAIN_ACTIVITY"

          echo ""
          echo "===== Checking flutterEmbedding ====="

          if ! grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            echo ""
            echo "ERROR: flutterEmbedding metadata was not found."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo ""
            echo "ERROR: flutterEmbedding is not set to value 2."
            exit 1
          fi

          echo ""
          echo "flutterEmbedding = 2 FOUND."

          echo ""
          echo "===== Checking for Android v1 FlutterApplication ====="

          if grep -q 'io.flutter.app.FlutterApplication' "$MANIFEST"; then
            echo ""
            echo "ERROR: Old FlutterApplication v1 embedding found."
            exit 1
          fi

          echo ""
          echo "No old FlutterApplication found."

          echo ""
          echo "===== Checking MainActivity embedding ====="

          if ! grep -q 'io.flutter.embedding.android.FlutterActivity' "$MAIN_ACTIVITY"; then
            echo ""
            echo "ERROR: MainActivity is not using Flutter v2 embedding."
            exit 1
          fi

          echo ""
          echo "MainActivity uses Flutter v2 embedding."

          echo ""
          echo "========================================"
          echo "FLUTTER ANDROID EMBEDDING VERIFIED"
          echo "========================================"

      # ========================================================
      # ANDROIDX
      # ========================================================

      - name: Configure AndroidX
        run: |
          touch android/gradle.properties

          sed -i '/^android.useAndroidX=/d' \
            android/gradle.properties

          sed -i '/^android.enableJetifier=/d' \
            android/gradle.properties

          echo "android.useAndroidX=true" \
            >> android/gradle.properties

          echo "android.enableJetifier=false" \
            >> android/gradle.properties

          echo ""
          echo "===== gradle.properties ====="

          cat android/gradle.properties

      # ========================================================
      # FLUTTER CLEAN
      # ========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ========================================================
      # PUB GET
      # ========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ========================================================
      # APP ICON
      # ========================================================

      - name: Generate Stelluriini app icon
        run: |
          dart run flutter_launcher_icons

          echo "========================================"
          echo "STELLURIINI APP ICON GENERATED"
          echo "========================================"

      # ========================================================
      # REMOVE GENERATED TESTS
      # ========================================================

      - name: Remove generated Flutter tests
        run: |
          rm -rf test

      # ========================================================
      # ANALYZE
      # ========================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ========================================================
      # BUILD APK
      # ========================================================

      - name: Build Stelluriini APK
        run: |
          flutter build apk --release

      # ========================================================
      # PREPARE APK
      # ========================================================

      - name: Prepare Stelluriini APK
        run: |
          mkdir -p build

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

          echo "========================================"
          echo "STELLURIINI APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh build/Stelluriini.apk

      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk