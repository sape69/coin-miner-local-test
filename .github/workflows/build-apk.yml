name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Regenerate Android project
        run: flutter create --platforms=android .

      - name: Update Android Gradle Plugin
        run: |
          sed -i 's/id "com.android.application" version "8.1.0"/id "com.android.application" version "8.1.1"/' android/settings.gradle
          grep 'com.android.application' android/settings.gradle

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-miner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
