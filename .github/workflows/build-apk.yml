name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Hae projektin tiedostot
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Asenna Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      # 3. Tarkista Flutter
      - name: Flutter version
        run: flutter --version

      # 4. Luo Android-projekti uudelleen
      - name: Regenerate Android project
        run: flutter create --platforms=android .

      # 5. Korjaa Android Gradle Plugin
      - name: Fix Android Gradle Plugin
        shell: bash
        run: |
          set -e

          sed -i \
            's/id "com.android.application" version "8.1.0"/id "com.android.application" version "8.1.1"/' \
            android/settings.gradle

          sed -i \
            "s/id 'com.android.application' version '8.1.0'/id 'com.android.application' version '8.1.1'/" \
            android/settings.gradle

          echo "Android Gradle Plugin:"
          grep "com.android.application" android/settings.gradle || true

      # 6. Aseta Android min SDK 23
      - name: Set Android minSdk 23
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          # Uudempi Flutter/Gradle-muoto
          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          # Vanhempi Gradle-muoto
          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          # Jos minSdk-arvoa ei löytynyt, lisää se defaultConfig-lohkoon
          if "minSdk = 23" not in text and "minSdkVersion 23" not in text:
              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdk = 23",
                  1
              )

          path.write_text(text)
          PY

          echo "Android minSdk:"
          grep -n "minSdk" android/app/build.gradle || true

      # 7. Hae riippuvuudet
      - name: Flutter dependencies
        run: flutter pub get

      # 8. Tarkista projektin analyysi
      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      # 9. Rakenna APK
      - name: Build APK
        run: flutter build apk --debug

      # 10. Lataa APK GitHub Actionsista
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-miner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
