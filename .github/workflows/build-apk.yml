
name: Build and Test Stelluriini Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Analyze, Test and Build Release
    runs-on: ubuntu-24.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. FLUTTER
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      # 3. JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 4. GRADLE CACHE
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. ANDROID SDK
      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 6. VERIFY FIREBASE
      - name: Verify Firebase configuration
        run: |
          FILE="android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Firebase configuration missing:"
            echo "$FILE"
            exit 1
          fi

          echo "Firebase configuration found."

      # 7. VERIFY APPLICATION ID
      - name: Verify application ID
        run: |
          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          grep -n "applicationId" "$FILE" || true

          if ! grep -q 'applicationId = "com.stelluriini.app"' "$FILE"; then
            echo "ERROR: Wrong applicationId."
            echo "Expected: com.stelluriini.app"
            exit 1
          fi

          echo "Application ID OK."

      # 8. FLUTTER CLEAN
      - name: Flutter clean
        run: flutter clean

      # 9. PUB GET
      - name: Flutter pub get
        run: |
          flutter pub get

          echo "=================================================="
          echo "VERIFYING GOOGLE PLAY BILLING DEPENDENCY"
          echo "=================================================="

          grep -A 8 "^  in_app_purchase:" pubspec.lock
          grep -A 8 "^  in_app_purchase_android:" pubspec.lock

      # 10. RESTORE RELEASE KEYSTORE
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STELLURIINI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "=================================================="
          echo "RESTORING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          mkdir -p android

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: STELLURIINI_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/stelluriini-upload-keystore.jks

          chmod 600 android/stelluriini-upload-keystore.jks

          if [ ! -s "android/stelluriini-upload-keystore.jks" ]; then
            echo "ERROR: Release keystore could not be restored."
            exit 1
          fi

          echo "Release keystore restored successfully."

      # 11. GENERATE APP ICON
      - name: Generate app icon
        run: |
          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo missing."
            exit 1
          fi

          dart run flutter_launcher_icons

      # 12. FLUTTER ANALYZE
      - name: Flutter analyze
        run: flutter analyze

      # 13. FLUTTER TEST
      - name: Flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found."
            echo "Skipping Flutter unit/widget tests."
          fi

      # 14. VERIFY RELEASE KEYSTORE
      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
        run: |
          echo "=================================================="
          echo "VERIFYING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/stelluriini-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias stelluriini-upload

          echo "Release keystore verification PASSED."

      # 15. BUILD RELEASE APP BUNDLE WITH RETRIES
      - name: Build release App Bundle
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          if [ -z "$STELLURIINI_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$STELLURIINI_KEY_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEY_PASSWORD secret is missing."
            exit 1
          fi

          MAX_ATTEMPTS=3

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=================================================="
            echo "AAB BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "=================================================="

            if flutter build appbundle --release; then
              echo "AAB BUILD SUCCESSFUL."
              exit 0
            fi

            echo "AAB build failed on attempt $ATTEMPT."

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Removing incomplete Gradle 8.14 distribution..."

              if [ -d "$HOME/.gradle/wrapper/dists" ]; then
                find "$HOME/.gradle/wrapper/dists" \
                  -maxdepth 2 \
                  -type d \
                  -name "gradle-8.14-bin" \
                  -prune \
                  -exec rm -rf {} +
              fi

              WAIT_SECONDS=$((ATTEMPT * 20))

              echo "Waiting ${WAIT_SECONDS} seconds before retry..."
              sleep "$WAIT_SECONDS"
            fi
          done

          echo "ERROR: AAB build failed after $MAX_ATTEMPTS attempts."
          exit 1

      # 16. DIAGNOSE MERGED ANDROID MANIFEST
      - name: Diagnose merged Android manifest
        if: always()
        run: |
          echo "=================================================="
          echo "ANDROID MANIFEST DIAGNOSTICS"
          echo "=================================================="

          echo "--- Configured app SDK ---"
          grep -nE 'minSdk|minSdkVersion|targetSdk' android/app/build.gradle || true

          echo "--- Manifest reports and merged manifests ---"
          find build/app -type f \
            \( -iname '*manifest*report*' -o -name 'AndroidManifest.xml' \) \
            -print 2>/dev/null | sort || true

          echo "--- SDK declarations in merged manifests ---"
          find build/app -type f -name AndroidManifest.xml \
            -print0 2>/dev/null |
            while IFS= read -r -d '' FILE; do
              if grep -qE 'uses-sdk|minSdkVersion' "$FILE"; then
                echo "FILE: $FILE"
                grep -nE 'uses-sdk|minSdkVersion|targetSdkVersion' "$FILE" || true
              fi
            done

          echo "--- Release manifest merger report ---"
          REPORT="build/app/outputs/logs/manifest-merger-release-report.txt"

          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Expected report not found at standard path."
          fi

          echo "=================================================="
          echo "END ANDROID MANIFEST DIAGNOSTICS"
          echo "=================================================="

      # 17. VERIFY APP BUNDLE
      - name: Verify App Bundle
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: App Bundle was not created."
            exit 1
          fi

          echo "App Bundle successfully created:"
          ls -lh "$AAB"

      # 18. BUILD RELEASE APK
      - name: Build release APK
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          flutter build apk --release

      # 19. VERIFY APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 20. UPLOAD RELEASE FILES
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: stelluriini-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

      # 21. REMOVE TEMPORARY RELEASE KEYSTORE
      - name: Remove temporary release keystore
        if: always()
        run: |
          rm -f android/stelluriini-upload-keystore.jks
          echo "Temporary release keystore removed from runner."

      # 22. BUILD SUMMARY
      - name: Build summary
        if: success()
        run: |
          echo "=================================================="
          echo "STELLURIINI RELEASE BUILD SUCCESSFUL"
          echo "=================================================="
          echo "Flutter version: 3.47.9"
          echo "App version: 1.0.14"
          echo "Version code: 16"
          echo "Google Play Billing: verified in pubspec.lock"
          echo "Flutter analyze: PASSED"
          echo "Flutter tests: PASSED / SKIPPED"
          echo "Release keystore: VERIFIED"
          echo "App Bundle: PASSED"
          echo "APK build: PASSED"
          echo "Artifact: stelluriini-release"
          echo "Retention: 3 days"
          echo "=================================================="
