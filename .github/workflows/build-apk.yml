name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Android SDK
      # ==========================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "sdkmanager:"
          "$SDKMANAGER" --version

      # ==========================================================
      # 5. Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      # ==========================================================
      # 6. Flutter project check
      # ==========================================================
      - name: Verify Flutter project
        run: |
          echo "===== PROJECT ROOT ====="
          pwd

          echo ""
          echo "===== TOP LEVEL ====="
          ls -la

          echo ""
          echo "===== ANDROID DIRECTORY ====="
          find android -maxdepth 4 -type f | sort

      # ==========================================================
      # 7. Firebase
      # ==========================================================
      - name: Verify Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 8. Print Android manifests
      # ==========================================================
      - name: Diagnose Android manifests
        run: |
          echo ""
          echo "=================================================="
          echo "ANDROID MANIFEST DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== ALL MANIFEST FILES ====="

          find android \
            -type f \
            -name "AndroidManifest.xml" \
            -print | sort

          echo ""
          echo "===== MANIFEST CONTENTS ====="

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"
            cat "$file"
          done < <(
            find android \
              -type f \
              -name "AndroidManifest.xml" \
              -print | sort
          )

      # ==========================================================
      # 9. Search ALL Android files for Flutter V1 references
      # ==========================================================
      - name: Diagnose Flutter V1 references
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER V1 REFERENCE SEARCH"
          echo "=================================================="

          echo ""
          echo "Searching android/ for io.flutter.app ..."

          if grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "io.flutter.app" \
            android 2>/dev/null; then

            echo ""
            echo "WARNING: Flutter V1 reference found."

          else

            echo ""
            echo "No io.flutter.app references found."

          fi

          echo ""
          echo "Searching entire repository for io.flutter.app ..."

          if grep -Rni \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            "io.flutter.app" \
            . 2>/dev/null; then

            echo ""
            echo "WARNING: Flutter V1 reference found somewhere in repository."

          else

            echo ""
            echo "No io.flutter.app references found in repository."

          fi

      # ==========================================================
      # 10. Search flutterEmbedding
      # ==========================================================
      - name: Diagnose flutterEmbedding metadata
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER EMBEDDING SEARCH"
          echo "=================================================="

          echo ""
          echo "Searching android/ for flutterEmbedding ..."

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "flutterEmbedding" \
            android 2>/dev/null || true

          echo ""
          echo "Searching android/ for embedding value 1 ..."

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="1"' \
            android 2>/dev/null || true

          echo ""
          echo "Searching android/ for embedding value 2 ..."

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="2"' \
            android 2>/dev/null || true

      # ==========================================================
      # 11. MainActivity diagnostics
      # ==========================================================
      - name: Diagnose MainActivity
        run: |
          echo ""
          echo "=================================================="
          echo "MAIN ACTIVITY DIAGNOSTICS"
          echo "=================================================="

          find android/app/src \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print | sort

          echo ""

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"
            cat "$file"
          done < <(
            find android/app/src \
              -type f \
              \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
              -print | sort
          )

      # ==========================================================
      # 12. Flutter project diagnostics
      # ==========================================================
      - name: Diagnose Flutter project
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER PROJECT DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== FLUTTER VERSION ====="
          flutter --version

          echo ""
          echo "===== DART VERSION ====="
          dart --version

          echo ""
          echo "===== FLUTTER DOCTOR ====="
          flutter doctor -v

          echo ""
          echo "===== FLUTTER CONFIG ====="
          flutter config

      # ==========================================================
      # 13. Gradle diagnostics
      # ==========================================================
      - name: Diagnose Gradle configuration
        run: |
          echo ""
          echo "=================================================="
          echo "GRADLE DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== android/settings.gradle ====="

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          fi

          echo ""
          echo "===== android/settings.gradle.kts ====="

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          fi

          echo ""
          echo "===== android/build.gradle ====="

          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          fi

          echo ""
          echo "===== android/build.gradle.kts ====="

          if [ -f android/build.gradle.kts ]; then
            cat android/build.gradle.kts
          fi

          echo ""
          echo "===== android/app/build.gradle ====="

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          echo ""
          echo "===== android/app/build.gradle.kts ====="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          fi

      # ==========================================================
      # 14. AndroidX
      # ==========================================================
      - name: Configure AndroidX
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^android.useAndroidX=true" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          echo ""
          echo "===== android/gradle.properties ====="
          cat android/gradle.properties

      # ==========================================================
      # 15. Flutter clean
      # ==========================================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 16. Pub get
      # ==========================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 17. Analyze
      # ==========================================================
      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 18. FINAL diagnostics immediately before build
      # ==========================================================
      - name: Final Android embedding diagnostics
        run: |
          echo ""
          echo "=================================================="
          echo "FINAL CHECK BEFORE FLUTTER BUILD"
          echo "=================================================="

          echo ""
          echo "===== ALL MANIFESTS ====="

          find android \
            -type f \
            -name "AndroidManifest.xml" \
            -print | sort

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"
            cat "$file"
          done < <(
            find android \
              -type f \
              -name "AndroidManifest.xml" \
              -print | sort
          )

          echo ""
          echo "===== V1 SEARCH ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "io.flutter.app" \
            android 2>/dev/null || true

          echo ""
          echo "===== EMBEDDING SEARCH ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "flutterEmbedding" \
            android 2>/dev/null || true

          echo ""
          echo "===== MAIN ACTIVITY ====="

          find android/app/src \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print | sort

          echo ""
          echo "=================================================="
          echo "END OF DIAGNOSTICS"
          echo "=================================================="

      # ==========================================================
      # 19. Build APK
      # ==========================================================
      - name: Build release APK
        run: |
          flutter build apk --release