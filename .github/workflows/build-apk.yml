name: Build and Test Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Analyze, Test and Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 5. VERIFY FIREBASE
      # ==========================================================

      - name: Verify Firebase configuration
        run: |
          FILE="android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Firebase configuration missing:"
            echo "$FILE"
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 6. VERIFY APPLICATION ID
      # ==========================================================

      - name: Verify application ID
        run: |
          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          grep -n "applicationId" "$FILE" || true

          if ! grep -q 'applicationId = "com.stelluriini.app"' "$FILE"; then
            echo "ERROR: Wrong applicationId."
            echo "Expected: com.stelluriini.app"
            exit 1
          fi

          echo "Application ID OK."

      # ==========================================================
      # 7. FLUTTER CLEAN
      # ==========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 8. PUB GET
      # ==========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 9. DOWNLOAD STELLURIINI RELEASE KEYSTORE
      # ==========================================================
      #
      # The release keystore is created by:
      #
      # .github/workflows/create-release-keystore.yml
      #
      # We download the latest successful keystore workflow
      # artifact instead of generating a new signing key.
      #
      # IMPORTANT:
      # Never generate a new release key for every APK build.
      # The same signing key must be preserved for future updates.
      #
      # ==========================================================

      - name: Download release keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=================================================="
          echo "DOWNLOADING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          mkdir -p android

          RUN_ID="$(
            gh run list \
              --workflow create-release-keystore.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful release keystore workflow found."
            exit 1
          fi

          echo "Release keystore workflow run:"
          echo "$RUN_ID"

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name stelluriini-release-keystore \
            --dir android

          if [ ! -f "android/stelluriini-upload-keystore.jks" ]; then
            echo "ERROR: Release keystore was not downloaded."
            echo ""
            echo "Expected:"
            echo "android/stelluriini-upload-keystore.jks"
            exit 1
          fi

          echo ""
          echo "Release keystore downloaded successfully."

          ls -lh android/stelluriini-upload-keystore.jks

      # ==========================================================
      # 10. GENERATE APP ICON
      # ==========================================================

      - name: Generate app icon
        run: |
          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo missing."
            exit 1
          fi

          dart run flutter_launcher_icons

      # ==========================================================
      # 11. FLUTTER ANALYZE
      # ==========================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 12. FLUTTER TEST
      # ==========================================================

      - name: Flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found."
            echo "Skipping Flutter unit/widget tests."
          fi

      # ==========================================================
      # 13. VERIFY RELEASE KEYSTORE
      # ==========================================================

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
        run: |
          echo "=================================================="
          echo "VERIFYING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/stelluriini-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias stelluriini-upload

          echo ""
          echo "Release keystore verification PASSED."

      # ==========================================================
      # 14. BUILD RELEASE APK
      # ==========================================================

      - name: Build release APK
        run: |
          echo "=================================================="
          echo "BUILDING STELLURIINI RELEASE APK"
          echo "=================================================="

          flutter build apk --release

      # ==========================================================
      # 15. VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 16. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ==========================================================
      # 17. BUILD SUMMARY
      # ==========================================================

      - name: Build summary
        run: |
          echo ""
          echo "=================================================="
          echo "🐱 STELLURIINI BUILD SUCCESSFUL"
          echo "=================================================="
          echo ""
          echo "Flutter analyze: PASSED"
          echo "Flutter tests:   PASSED / SKIPPED"
          echo "Release keystore: VERIFIED"
          echo "APK build:       PASSED"
          echo ""
          echo "APK:"
          echo "build/app/outputs/flutter-apk/app-release.apk"
          echo ""
          echo "=================================================="