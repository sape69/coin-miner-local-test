name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"


      # ==========================================
      # CHECK FIREBASE
      # ==========================================

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase..."

          test -f android/app/google-services.json

          echo "google-services.json found."

          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Firebase configuration OK."


      # ==========================================
      # CHECK ANDROID CONFIGURATION
      # ==========================================

      - name: Verify Android configuration
        run: |
          echo "===== android/app/build.gradle ====="

          cat android/app/build.gradle

          echo "===== google-services.json ====="

          test -f android/app/google-services.json


      # ==========================================
      # FLUTTER DEPENDENCIES
      # ==========================================

      - name: Flutter clean
        run: |
          flutter clean

      - name: Flutter pub get
        run: |
          flutter pub get


      # ==========================================
      # ANALYZE
      # ==========================================

      - name: Flutter analyze
        run: |
          flutter analyze


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Stelluriini APK
        run: |
          flutter build apk --release


      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Prepare APK
        run: |
          mkdir -p build

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

          ls -lh build/Stelluriini.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk