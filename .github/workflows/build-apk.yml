name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Hae projekti
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Asenna Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true


      # 3. Tarkista Flutter
      - name: Show Flutter version
        run: flutter --version


      # 4. Luo Android-projekti
      - name: Create Android project
        run: |
          flutter create --platforms=android .

          # flutter create luo oletuksena widget_test.dart-tiedoston.
          # Meidän sovelluksemme ei käytä MyApp-luokkaa,
          # joten poistetaan automaattisesti luotu testi.
          rm -rf test


      # 5. Korjaa Android Gradle Plugin + Kotlin
      - name: Fix Android Gradle and Kotlin
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle")
          text = path.read_text()

          # Android Gradle Plugin
          text = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+',
              r'\g<1>8.1.1',
              text
          )

          # Kotlin
          text = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+',
              r'\g<1>2.1.0',
              text
          )

          path.write_text(text)
          PY

          echo "===== settings.gradle ====="
          cat android/settings.gradle


      # 6. Aseta minSdk 23
      - name: Set minSdk 23
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          path.write_text(text)
          PY

          echo "===== minSdk ====="
          grep -n "minSdk" android/app/build.gradle || true


      # 7. Lisää AdMob TESTI App ID
      - name: Configure AdMob
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          # Googlen virallinen AdMob TESTI App ID
          app_id = "ca-app-pub-3940256099942544~3347511713"

          metadata = (
              '        <meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              f'android:value="{app_id}"/>\n'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:

              text = text.replace(
                  "<application",
                  "<application\n" + metadata,
                  1
              )

          path.write_text(text)
          PY

          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml


      # 8. Flutter riippuvuudet
      - name: Flutter dependencies
        run: flutter pub get


      # 9. Tarkista Flutter-projekti
      - name: Flutter analyze
        run: flutter analyze


      # 10. Rakenna APK
      - name: Build APK
        run: |
          flutter build apk --debug


      # 11. Tallenna Android-kansio GitHubiin
      - name: Commit Android project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit."
          else
            git commit -m "Add generated Android project"
            git push
          fi


      # 12. Lataa APK GitHub Actionsiin
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-miner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
