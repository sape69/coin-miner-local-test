name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. Setup Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Verify Android SDK
      # ==========================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo ""
          echo "===== SDKMANAGER VERSION ====="
          "$SDKMANAGER" --version

      # ==========================================================
      # 5. Install Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      # ==========================================================
      # 6. Verify Flutter project
      # ==========================================================
      - name: Verify Flutter project
        run: |
          echo "===== PROJECT ROOT ====="
          pwd

          echo ""
          echo "===== TOP LEVEL ====="
          ls -la

          echo ""
          echo "===== ANDROID DIRECTORY ====="

          find android \
            -maxdepth 6 \
            -type f \
            | sort

      # ==========================================================
      # 7. Verify Firebase configuration
      # ==========================================================
      - name: Verify Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 8. Diagnose ALL Android manifests
      # ==========================================================
      - name: Diagnose Android manifests
        run: |
          echo ""
          echo "=================================================="
          echo "ANDROID MANIFEST DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== ALL MANIFEST FILES ====="

          find android \
            -type f \
            -name "AndroidManifest.xml" \
            -print \
            | sort

          echo ""
          echo "===== MANIFEST CONTENTS ====="

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"

            cat "$file"

          done < <(
            find android \
              -type f \
              -name "AndroidManifest.xml" \
              -print \
              | sort
          )

      # ==========================================================
      # 9. Diagnose Flutter V1 references
      #
      # IMPORTANT:
      # Search ONLY android/.
      #
      # Do not search "." because this workflow itself contains
      # diagnostic strings such as io.flutter.app.
      # ==========================================================
      - name: Diagnose Flutter V1 references
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER V1 REFERENCE SEARCH"
          echo "=================================================="

          echo ""
          echo "===== SEARCH android/ FOR FLUTTER V1 REFERENCES ====="

          if grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            -E "io\.flutter\.app|FlutterApplication" \
            android 2>/dev/null; then

            echo ""
            echo "ERROR: Flutter V1 reference found in android/."
            exit 1

          else

            echo "No Flutter V1 references found in android/."

          fi

      # ==========================================================
      # 10. Diagnose flutterEmbedding
      # ==========================================================
      - name: Diagnose flutterEmbedding metadata
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER EMBEDDING SEARCH"
          echo "=================================================="

          echo ""
          echo "===== SEARCH FOR flutterEmbedding ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "flutterEmbedding" \
            android 2>/dev/null || true

          echo ""
          echo "===== SEARCH FOR EMBEDDING VALUE 1 ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="1"' \
            android 2>/dev/null || true

          echo ""
          echo "===== SEARCH FOR EMBEDDING VALUE 2 ====="

          grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'android:value="2"' \
            android 2>/dev/null || true

      # ==========================================================
      # 11. Diagnose MainActivity
      # ==========================================================
      - name: Diagnose MainActivity
        run: |
          echo ""
          echo "=================================================="
          echo "MAIN ACTIVITY DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== MAIN ACTIVITY FILES ====="

          find android/app/src \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o \
              -name "MainActivity.java" \
            \) \
            -print \
            | sort

          echo ""
          echo "===== MAIN ACTIVITY CONTENT ====="

          while IFS= read -r file; do
            echo ""
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"

            cat "$file"

          done < <(
            find android/app/src \
              -type f \
              \( \
                -name "MainActivity.kt" \
                -o \
                -name "MainActivity.java" \
              \) \
              -print \
              | sort
          )

      # ==========================================================
      # 12. Diagnose Flutter
      # ==========================================================
      - name: Diagnose Flutter project
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER PROJECT DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== FLUTTER VERSION ====="

          flutter --version

          echo ""
          echo "===== DART VERSION ====="

          dart --version

          echo ""
          echo "===== FLUTTER DOCTOR ====="

          flutter doctor -v

      # ==========================================================
      # 13. Diagnose Gradle configuration
      # ==========================================================
      - name: Diagnose Gradle configuration
        run: |
          echo ""
          echo "=================================================="
          echo "GRADLE DIAGNOSTICS"
          echo "=================================================="

          echo ""
          echo "===== android/settings.gradle ====="

          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/settings.gradle.kts ====="

          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/build.gradle ====="

          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/build.gradle.kts ====="

          if [ -f android/build.gradle.kts ]; then
            cat android/build.gradle.kts
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/app/build.gradle ====="

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          else
            echo "File not found."
          fi

          echo ""
          echo "===== android/app/build.gradle.kts ====="

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          else
            echo "File not found."
          fi

      # ==========================================================
      # 14. Exact Flutter embedding detection test
      # ==========================================================
      - name: Exact Flutter embedding detection test
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "EXACT FLUTTER EMBEDDING DETECTION TEST"
          echo "=================================================="

          if [ -f android/build.gradle ]; then

            echo "Gradle project detected."
            SELECTED_MANIFEST="android/app/src/main/AndroidManifest.xml"

          elif [ -f android/build.gradle.kts ]; then

            echo "Gradle Kotlin project detected."
            SELECTED_MANIFEST="android/app/src/main/AndroidManifest.xml"

          else

            echo "No Android Gradle root file found."
            SELECTED_MANIFEST="android/AndroidManifest.xml"

          fi

          echo ""
          echo "=================================================="
          echo "SELECTED MANIFEST"
          echo "=================================================="

          echo "$SELECTED_MANIFEST"

          if [ ! -f "$SELECTED_MANIFEST" ]; then
            echo ""
            echo "ERROR:"
            echo "Selected Flutter manifest does not exist."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "SELECTED MANIFEST CONTENT"
          echo "=================================================="

          cat "$SELECTED_MANIFEST"

          echo ""
          echo "=================================================="
          echo "XML PARSER RESULT"
          echo "=================================================="

          set +e

          python3 - "$SELECTED_MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = sys.argv[1]

          print(f"Parsing: {manifest_path}")

          try:
              tree = ET.parse(manifest_path)
              root = tree.getroot()
          except Exception as exc:
              print(f"ERROR: XML parsing failed: {exc}")
              sys.exit(1)

          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          NAME = f"{{{ANDROID_NS}}}name"
          VALUE = f"{{{ANDROID_NS}}}value"

          print("")
          print("XML parsing succeeded.")

          for application in root.iter("application"):
              application_name = application.attrib.get(NAME)

              print("")
              print("Application android:name:")
              print(repr(application_name))

              if application_name == "io.flutter.app.FlutterApplication":
                  print("")
                  print("RESULT: FLUTTER V1")
                  sys.exit(2)

          for metadata in root.iter("meta-data"):
              name = metadata.attrib.get(NAME)
              value = metadata.attrib.get(VALUE)

              if name == "flutterEmbedding":

                  print("")
                  print("Found flutterEmbedding metadata.")
                  print(f"android:name = {name!r}")
                  print(f"android:value = {value!r}")

                  if value == "1":
                      print("")
                      print("RESULT: FLUTTER V1")
                      sys.exit(2)

                  if value == "2":
                      print("")
                      print("RESULT: FLUTTER V2")
                      sys.exit(0)

          print("")
          print("RESULT: FLUTTER V1")
          print("Reason: flutterEmbedding value 2 was not found.")
          sys.exit(2)
          PY

          XML_RESULT=$?

          set -e

          echo ""
          echo "=================================================="
          echo "EXACT DETECTION EXIT CODE: $XML_RESULT"
          echo "=================================================="

          if [ "$XML_RESULT" -ne 0 ]; then
            echo ""
            echo "Flutter V2 embedding was NOT detected."
            exit 1
          fi

          echo ""
          echo "EXACT FLUTTER EMBEDDING TEST PASSED."

      # ==========================================================
      # 15. Configure AndroidX
      # ==========================================================
      - name: Configure AndroidX
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -q "^android.useAndroidX=true" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          echo ""
          echo "===== android/gradle.properties ====="

          cat android/gradle.properties

      # ==========================================================
      # 16. Flutter clean
      # ==========================================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 17. Flutter pub get
      # ==========================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 18. Generate Stelluriini app icon
      # ==========================================================
      - name: Generate Stelluriini app icon
        run: |
          echo ""
          echo "=================================================="
          echo "GENERATING STELLURIINI APP ICON"
          echo "=================================================="

          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo was not found:"
            echo "assets/images/stelluriini_logo.png"
            exit 1
          fi

          echo "Logo found:"
          ls -lh assets/images/stelluriini_logo.png

          echo ""
          echo "Running flutter_launcher_icons..."

          dart run flutter_launcher_icons

          echo ""
          echo "Stelluriini app icon generation completed."

      # ==========================================================
      # 19. Flutter analyze
      # ==========================================================
      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 20. FINAL EXACT EMBEDDING CHECK
      # ==========================================================
      - name: Final exact embedding check
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "FINAL EMBEDDING CHECK BEFORE BUILD"
          echo "=================================================="

          if [ -f android/build.gradle ]; then
            SELECTED_MANIFEST="android/app/src/main/AndroidManifest.xml"

          elif [ -f android/build.gradle.kts ]; then
            SELECTED_MANIFEST="android/app/src/main/AndroidManifest.xml"

          else
            SELECTED_MANIFEST="android/AndroidManifest.xml"

          fi

          echo "Flutter-selected manifest:"
          echo "$SELECTED_MANIFEST"

          echo ""
          echo "Manifest exists?"

          if [ ! -f "$SELECTED_MANIFEST" ]; then
            echo "NO"
            exit 1
          fi

          echo "YES"

          echo ""
          echo "Manifest:"
          cat "$SELECTED_MANIFEST"

          echo ""
          echo "Embedding metadata:"

          grep -n "flutterEmbedding" "$SELECTED_MANIFEST" || true
          grep -n 'android:value="2"' "$SELECTED_MANIFEST" || true

          echo ""
          echo "Final exact check passed."

      # ==========================================================
      # 21. Verbose APK build
      # ==========================================================
      - name: Build release APK - verbose diagnostics
        shell: bash
        run: |
          set +e

          echo ""
          echo "=================================================="
          echo "FLUTTER VERBOSE APK BUILD"
          echo "=================================================="

          flutter build apk --release -v 2>&1 | tee flutter_build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=================================================="
          echo "SEARCHING BUILD LOG"
          echo "=================================================="

          echo ""
          echo "--- Android embedding references ---"

          grep -ni -E \
            "embedding|FlutterActivity|FlutterApplication|AndroidManifest|project.dart|v1|v2" \
            flutter_build.log \
            | tail -200 || true

          echo ""
          echo "--- Manifest references ---"

          grep -ni -E \
            "AndroidManifest.xml|flutterEmbedding" \
            flutter_build.log \
            | tail -100 || true

          echo ""
          echo "--- Final Flutter error ---"

          grep -ni -E \
            "Build failed due to use of deleted Android v1 embedding|FAILURE|ERROR|Exception" \
            flutter_build.log \
            | tail -100 || true

          echo ""
          echo "Flutter build exit code: $BUILD_EXIT"

          exit "$BUILD_EXIT"

      # ==========================================================
      # 22. Upload verbose build log
      # ==========================================================
      - name: Upload Flutter build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-diagnostics
          path: flutter_build.log
          if-no-files-found: ignore

      # ==========================================================
      # 23. Verify APK
      # ==========================================================
      - name: Verify APK
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 24. Upload APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error