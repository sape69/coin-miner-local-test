name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"


      # ==========================================
      # VERIFY FIREBASE
      # ==========================================

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase configuration..."

          test -f android/app/google-services.json

          echo "google-services.json found."

          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Firebase configuration OK."


      # ==========================================
      # VERIFY ANDROID PROJECT
      # ==========================================

      - name: Verify Android project
        run: |
          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== google-services.json ====="
          test -f android/app/google-services.json

          echo "Android project OK."


      # ==========================================
      # CHECK ICON
      # ==========================================

      - name: Check Stelluriini icon
        run: |
          test -f stelluriini_icon.png
          echo "Stelluriini icon found."


      # ==========================================
      # INSTALL IMAGEMAGICK
      # ==========================================

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ==========================================
      # CREATE ANDROID ICONS
      # ==========================================

      - name: Create Android launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert stelluriini_icon.png \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Launcher icons created."


      # ==========================================
      # APP NAME
      # ==========================================

      - name: Set application name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="Stelluriini"/' \
            android/app/src/main/AndroidManifest.xml

          echo "Application name set to Stelluriini."


      # ==========================================
      # DISABLE JETIFIER
      # ==========================================

      - name: Configure AndroidX and Jetifier
        run: |
          touch android/gradle.properties

          sed -i '/^android.useAndroidX=/d' \
            android/gradle.properties

          sed -i '/^android.enableJetifier=/d' \
            android/gradle.properties

          echo "android.useAndroidX=true" >> \
            android/gradle.properties

          echo "android.enableJetifier=false" >> \
            android/gradle.properties

          echo "===== gradle.properties ====="
          cat android/gradle.properties


      # ==========================================
      # FLUTTER CLEAN
      # ==========================================

      - name: Flutter clean
        run: |
          flutter clean


      # ==========================================
      # FLUTTER PUB GET
      # ==========================================

      - name: Flutter pub get
        run: |
          flutter pub get


      # ==========================================
      # REMOVE GENERATED TESTS
      # ==========================================

      - name: Remove generated Flutter tests
        run: |
          rm -rf test


      # ==========================================
      # FLUTTER ANALYZE
      # ==========================================

      - name: Flutter analyze
        run: |
          flutter analyze


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Stelluriini APK
        run: |
          flutter build apk --release


      # ==========================================
      # PREPARE APK
      # ==========================================

      - name: Prepare Stelluriini APK
        run: |
          mkdir -p build

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

          echo "========================================"
          echo "STELLURIINI APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh build/Stelluriini.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk