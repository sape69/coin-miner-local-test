name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android project
        run: |
          flutter create --platforms=android .

      - name: Fix Android Gradle and Kotlin
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle")
          text = path.read_text()

          text = re.sub(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+',
              r'\g<1>8.1.1',
              text
          )

          text = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+',
              r'\g<1>2.1.0',
              text
          )

          path.write_text(text)
          PY

      - name: Set minSdk 23
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          text = text.replace(
              "minSdkVersion flutter.minSdkVersion",
              "minSdkVersion 23"
          )

          path.write_text(text)
          PY

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Commit Android folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android

          if git diff --cached --quiet; then
            echo "No Android changes to commit."
          else
            git commit -m "Add generated Android project"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-miner-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
