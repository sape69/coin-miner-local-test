name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Setup Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. Setup Java 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Verify Android SDK
      # ==========================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo ""
          echo "SDKMANAGER:"
          "$SDKMANAGER" --version

      # ==========================================================
      # 5. Install Android SDK 36
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK 36..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 6. Verify Flutter project
      # ==========================================================
      - name: Verify Flutter project
        run: |
          echo "===== PROJECT ROOT ====="
          pwd

          echo ""
          echo "===== TOP LEVEL ====="
          ls -la

          echo ""
          echo "===== ANDROID FILES ====="

          find android \
            -maxdepth 6 \
            -type f \
            | sort

      # ==========================================================
      # 7. Verify Firebase configuration
      # ==========================================================
      - name: Verify Firebase configuration
        run: |
          FILE="android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          echo ""
          echo "Firebase configuration found."

          python3 - "$FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expected = "com.example.stelluriini"

          found = []

          for client in data.get("client", []):
              package_name = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package_name:
                  found.append(package_name)

          print("")
          print("Firebase Android package names:")

          for package_name in found:
              print("  " + package_name)

          if expected not in found:
              print("")
              print("ERROR:")
              print("Expected Firebase package:")
              print(expected)
              sys.exit(1)

          print("")
          print("Firebase package check PASSED.")
          PY

      # ==========================================================
      # 8. Verify applicationId / namespace
      # ==========================================================
      - name: Verify Android application identity
        run: |
          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "ANDROID APPLICATION IDENTITY"
          echo "=================================================="

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "===== android/app/build.gradle ====="

          grep -n -E \
            'namespace|applicationId|compileSdk|targetSdk|minSdk' \
            "$FILE" || true

          echo ""
          echo "===== EXPECTED VALUES ====="
          echo "namespace     = com.stelluriini.app"
          echo "applicationId = com.example.stelluriini"

          echo ""
          echo "===== CHECK APPLICATION ID ====="

          if ! grep -q 'applicationId = "com.example.stelluriini"' "$FILE"; then
            echo ""
            echo "ERROR: applicationId is NOT com.example.stelluriini."
            echo ""
            echo "Repository version:"
            grep -n "applicationId" "$FILE" || true
            exit 1
          fi

          echo "applicationId CHECK PASSED."

          echo ""
          echo "===== CHECK NAMESPACE ====="

          if ! grep -q 'namespace = "com.stelluriini.app"' "$FILE"; then
            echo ""
            echo "ERROR: namespace is not com.stelluriini.app."
            grep -n "namespace" "$FILE" || true
            exit 1
          fi

          echo "namespace CHECK PASSED."

      # ==========================================================
      # 9. Verify Android manifest
      # ==========================================================
      - name: Verify Android manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo ""
          echo "=================================================="
          echo "ANDROID MANIFEST"
          echo "=================================================="

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found."
            exit 1
          fi

          echo ""
          echo "Manifest:"
          cat "$MANIFEST"

          echo ""
          echo "===== FLUTTER EMBEDDING ====="

          if grep -q 'android:name="flutterEmbedding"' "$MANIFEST" &&
             grep -q 'android:value="2"' "$MANIFEST"; then

            echo "Flutter V2 embedding detected."

          else

            echo "ERROR: Flutter V2 embedding metadata not found."
            exit 1

          fi

      # ==========================================================
      # 10. Check Flutter V1 references
      #
      # IMPORTANT:
      # Search ONLY android/.
      # Do NOT search the whole repository because this workflow
      # itself contains the text "io.flutter.app".
      # ==========================================================
      - name: Check Flutter V1 references
        run: |
          echo ""
          echo "=================================================="
          echo "FLUTTER V1 CHECK"
          echo "=================================================="

          echo ""
          echo "Searching only android/..."

          V1_FOUND=0

          if grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "io.flutter.app" \
            android 2>/dev/null; then

            V1_FOUND=1

          fi

          if grep -Rni \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            "FlutterApplication" \
            android 2>/dev/null; then

            V1_FOUND=1

          fi

          if [ "$V1_FOUND" -eq 1 ]; then
            echo ""
            echo "ERROR: Flutter V1 reference found inside android/."
            exit 1
          fi

          echo ""
          echo "No Flutter V1 references found in android/."

      # ==========================================================
      # 11. Diagnose MainActivity
      # ==========================================================
      - name: Verify MainActivity
        run: |
          echo ""
          echo "=================================================="
          echo "MAIN ACTIVITY"
          echo "=================================================="

          find android/app/src \
            -type f \
            \( \
              -name "MainActivity.kt" \
              -o \
              -name "MainActivity.java" \
            \) \
            -print \
            | sort

          echo ""

          while IFS= read -r file; do
            echo "-----------------------------------------------"
            echo "FILE: $file"
            echo "-----------------------------------------------"
            cat "$file"
            echo ""
          done < <(
            find android/app/src \
              -type f \
              \( \
                -name "MainActivity.kt" \
                -o \
                -name "MainActivity.java" \
              \) \
              -print \
              | sort
          )

      # ==========================================================
      # 12. Flutter diagnostics
      # ==========================================================
      - name: Flutter diagnostics
        run: |
          echo ""
          flutter --version

          echo ""
          dart --version

      # ==========================================================
      # 13. Configure AndroidX
      # ==========================================================
      - name: Configure AndroidX
        run: |
          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          grep -q "^android.useAndroidX=true" \
            android/gradle.properties \
            || echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=true" \
            android/gradle.properties \
            || echo "android.enableJetifier=true" >> android/gradle.properties

          echo ""
          echo "===== gradle.properties ====="
          cat android/gradle.properties

      # ==========================================================
      # 14. Flutter clean
      # ==========================================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 15. Flutter pub get
      # ==========================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 16. Generate app icon
      # ==========================================================
      - name: Generate Stelluriini app icon
        run: |
          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo not found."
            exit 1
          fi

          dart run flutter_launcher_icons

      # ==========================================================
      # 17. Flutter analyze
      # ==========================================================
      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 18. Final identity check
      # ==========================================================
      - name: Final Android identity check
        run: |
          echo ""
          echo "=================================================="
          echo "FINAL ANDROID IDENTITY CHECK"
          echo "=================================================="

          echo ""
          echo "BUILD.GRADLE:"
          grep -n -E \
            'namespace|applicationId|compileSdk|targetSdk|minSdk' \
            android/app/build.gradle

          echo ""
          echo "FIREBASE:"
          grep -n "package_name" \
            android/app/google-services.json

          echo ""
          echo "MANIFEST:"
          grep -n "flutterEmbedding" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "FINAL CHECK PASSED."

      # ==========================================================
      # 19. Build release APK
      # ==========================================================
      - name: Build release APK
        shell: bash
        run: |
          set +e

          echo ""
          echo "=================================================="
          echo "BUILDING RELEASE APK"
          echo "=================================================="

          flutter build apk --release 2>&1 | tee flutter_build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=================================================="
          echo "BUILD RESULT"
          echo "=================================================="

          echo "Exit code: $BUILD_EXIT"

          echo ""
          echo "=================================================="
          echo "IMPORTANT ERRORS"
          echo "=================================================="

          grep -ni -E \
            "FAILURE:|ERROR:|Execution failed|BUILD FAILED|Exception:|Could not|What went wrong|Caused by:" \
            flutter_build.log \
            | tail -80 || true

          echo ""
          echo "=================================================="
          echo "FLUTTER V1 / EMBEDDING ERRORS"
          echo "=================================================="

          grep -ni -E \
            "deleted Android v1 embedding|FlutterApplication|io.flutter.app|flutterEmbedding" \
            flutter_build.log \
            | tail -50 || true

          echo ""
          echo "=================================================="
          echo "END OF BUILD"
          echo "=================================================="

          exit "$BUILD_EXIT"

      # ==========================================================
      # 20. Upload build log
      # ==========================================================
      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_build.log
          if-no-files-found: ignore

      # ==========================================================
      # 21. Verify APK
      # ==========================================================
      - name: Verify APK
        if: success()
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 22. Upload APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error