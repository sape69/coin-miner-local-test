
name: Build and Test Stelluriini Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Analyze, Test and Build Release
    runs-on: ubuntu-24.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: "28.2.13676358"

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. FREE DISK SPACE
      - name: Free runner disk space
        run: |
          echo "DISK SPACE BEFORE CLEANUP"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          docker system prune -af || true

          echo "DISK SPACE AFTER CLEANUP"
          df -h

      # 3. FLUTTER
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      # 4. JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 5. ANDROID SDK AND REQUIRED NDK
      - name: Setup Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Removing preinstalled NDK versions..."
          sudo rm -rf "$ANDROID_SDK_ROOT/ndk"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "Installed NDK versions:"
          ls -la "$ANDROID_SDK_ROOT/ndk"

          if [ ! -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358" ]; then
            echo "ERROR: Required NDK was not installed."
            exit 1
          fi

          df -h

      # 6. VERIFY FIREBASE
      - name: Verify Firebase configuration
        run: |
          FILE="android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Firebase configuration missing:"
            echo "$FILE"
            exit 1
          fi

          echo "Firebase configuration found."

      # 7. VERIFY APPLICATION ID
      - name: Verify application ID
        run: |
          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          grep -n "applicationId" "$FILE" || true

          if ! grep -q 'applicationId = "com.stelluriini.app"' "$FILE"; then
            echo "ERROR: Wrong applicationId."
            echo "Expected: com.stelluriini.app"
            exit 1
          fi

          echo "Application ID OK."

      # 8. SET REQUIRED NDK VERSION
      - name: Configure Android NDK version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          version = "28.2.13676358"

          pattern = r"(?m)^\s*ndkVersion\s+.*$"

          if re.search(pattern, content):
              content = re.sub(
                  pattern,
                  f'    ndkVersion "{version}"',
                  content,
                  count=1
              )
          else:
              match = re.search(r"(?m)^android\s*\{", content)

              if not match:
                  raise SystemExit(
                      "ERROR: Could not find android { block."
                  )

              insert_at = match.end()
              content = (
                  content[:insert_at]
                  + f'\n    ndkVersion "{version}"'
                  + content[insert_at:]
              )

          path.write_text(content)

          print("Configured Android NDK:", version)
          PY

          grep -n "ndkVersion" android/app/build.gradle

      # 9. FLUTTER CLEAN
      - name: Flutter clean
        run: flutter clean

      # 10. PUB GET
      - name: Flutter pub get
        run: |
          flutter pub get

          echo "=================================================="
          echo "VERIFYING GOOGLE PLAY BILLING DEPENDENCY"
          echo "=================================================="

          grep -A 8 "^  in_app_purchase:" pubspec.lock
          grep -A 8 "^  in_app_purchase_android:" pubspec.lock

      # 11. RESTORE RELEASE KEYSTORE
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STELLURIINI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "RESTORING STELLURIINI RELEASE KEYSTORE"

          mkdir -p android

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Keystore secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/stelluriini-upload-keystore.jks

          chmod 600 android/stelluriini-upload-keystore.jks

          if [ ! -s "android/stelluriini-upload-keystore.jks" ]; then
            echo "ERROR: Keystore restore failed."
            exit 1
          fi

          echo "Release keystore restored."

      # 12. GENERATE APP ICON
      - name: Generate app icon
        run: |
          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo missing."
            exit 1
          fi

          dart run flutter_launcher_icons

      # 13. FLUTTER ANALYZE
      - name: Flutter analyze
        run: flutter analyze

      # 14. FLUTTER TEST
      - name: Flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found."
            echo "Skipping Flutter tests."
          fi

      # 15. VERIFY RELEASE KEYSTORE
      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Keystore password secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/stelluriini-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias stelluriini-upload

          echo "Release keystore verification PASSED."

      # 16. BUILD RELEASE APP BUNDLE
      - name: Build release App Bundle
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          if [ -z "$STELLURIINI_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Keystore password is missing."
            exit 1
          fi

          if [ -z "$STELLURIINI_KEY_PASSWORD" ]; then
            echo "ERROR: Key password is missing."
            exit 1
          fi

          echo "Checking disk space before AAB build..."
          df -h

          flutter build appbundle --release

          echo "AAB BUILD COMPLETED."

      # 17. DIAGNOSE MERGED ANDROID MANIFEST
      - name: Diagnose merged Android manifest
        if: always()
        run: |
          echo "ANDROID MANIFEST DIAGNOSTICS"

          grep -nE 'minSdk|minSdkVersion|targetSdk' \
            android/app/build.gradle || true

          find build/app -type f \
            \( -iname '*manifest*report*' -o -name 'AndroidManifest.xml' \) \
            -print 2>/dev/null | sort || true

          REPORT="build/app/outputs/logs/manifest-merger-release-report.txt"

          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Manifest merger report not found."
          fi

      # 18. VERIFY APP BUNDLE
      - name: Verify App Bundle
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: App Bundle was not created."
            exit 1
          fi

          echo "App Bundle successfully created:"
          ls -lh "$AAB"

      # 19. BUILD RELEASE APK
      - name: Build release APK
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          echo "Checking disk space before APK build..."
          df -h

          flutter build apk --release

      # 20. VERIFY APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 21. UPLOAD RELEASE FILES
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: stelluriini-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

      # 22. REMOVE TEMPORARY RELEASE KEYSTORE
      - name: Remove temporary release keystore
        if: always()
        run: |
          rm -f android/stelluriini-upload-keystore.jks
          echo "Temporary release keystore removed."

      # 23. BUILD SUMMARY
      - name: Build summary
        if: success()
        run: |
          echo "=================================================="
          echo "STELLURIINI RELEASE BUILD SUCCESSFUL"
          echo "=================================================="

          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          if [ -z "$VERSION_LINE" ]; then
            echo "ERROR: Could not read version."
            exit 1
          fi

          if [[ "$VERSION_LINE" == *"+"* ]]; then
            APP_VERSION="${VERSION_LINE%%+*}"
            VERSION_CODE="${VERSION_LINE##*+}"
          else
            echo "ERROR: Version code is missing."
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid version code: $VERSION_CODE"
            exit 1
          fi

          echo "Flutter version: 3.47.9"
          echo "App version: $APP_VERSION"
          echo "Version code: $VERSION_CODE"
          echo "NDK version: 28.2.13676358"
          echo "Flutter analyze: PASSED"
          echo "Flutter tests: PASSED / SKIPPED"
          echo "Release keystore: VERIFIED"
          echo "App Bundle: PASSED"
          echo "APK build: PASSED"
          echo "Artifact: stelluriini-release"
          echo "Retention: 3 days"
          echo "=================================================="
