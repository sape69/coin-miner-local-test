name: Build Stelluriini APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      - name: Verify Firebase configuration
        run: |
          echo "Checking Firebase configuration..."
          test -f android/app/google-services.json
          echo "google-services.json found."
          grep -o '"package_name": "[^"]*"' android/app/google-services.json
          echo "Firebase configuration OK."

      - name: Check Stelluriini logo
        run: |
          echo "Checking logo..."
          test -f assets/images/stelluriini_logo.png
          echo "========================================"
          echo "STELLURIINI LOGO FOUND"
          echo "========================================"

      - name: Verify Flutter source files
        run: |
          echo "===== lib/main.dart ====="
          sed -n '1,260p' lib/main.dart

          echo "===== lib/pages/login_page.dart ====="
          sed -n '1,360p' lib/pages/login_page.dart

          echo "Flutter source files verified."

      - name: Verify Android MainActivity
        run: |
          echo "===== MainActivity.kt ====="
          cat android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt
          echo "MainActivity verified."

      - name: Verify Android project
        run: |
          echo "===== settings.gradle ====="
          cat android/settings.gradle

          echo "===== app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== Firebase ====="
          test -f android/app/google-services.json

          echo "Android project OK."

      - name: Set application name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Stelluriini"/' android/app/src/main/AndroidManifest.xml
          echo "Application name set to Stelluriini."

      - name: Configure AndroidX
        run: |
          touch android/gradle.properties

          sed -i '/^android.useAndroidX=/d' android/gradle.properties
          sed -i '/^android.enableJetifier=/d' android/gradle.properties

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=false" >> android/gradle.properties

          echo "===== gradle.properties ====="
          cat android/gradle.properties

      - name: Flutter clean
        run: |
          flutter clean

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Generate Stelluriini app icon
        run: |
          dart run flutter_launcher_icons

          echo "========================================"
          echo "STELLURIINI APP ICON GENERATED"
          echo "========================================"

      - name: Remove generated Flutter tests
        run: |
          rm -rf test

      - name: Flutter analyze
        run: |
          flutter analyze

      - name: Build Stelluriini APK
        run: |
          flutter build apk --release

      - name: Prepare Stelluriini APK
        run: |
          mkdir -p build

          cp build/app/outputs/flutter-apk/app-release.apk build/Stelluriini.apk

          echo "========================================"
          echo "STELLURIINI APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh build/Stelluriini.apk

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk