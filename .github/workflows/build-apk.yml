name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.1"

      # ----------------------------------------------------------
      # Save Firebase configuration
      # ----------------------------------------------------------

      - name: Save Firebase configuration
        run: |
          test -f android/app/google-services.json

          cp android/app/google-services.json \
            /tmp/google-services.json

      # ----------------------------------------------------------
      # Create clean Flutter Android project
      # ----------------------------------------------------------

      - name: Create clean Flutter Android project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --project-name stelluriini \
            --org com.example \
            .

      # ----------------------------------------------------------
      # Restore Firebase configuration
      # ----------------------------------------------------------

      - name: Restore Firebase configuration
        run: |
          cp /tmp/google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

      # ----------------------------------------------------------
      # Configure Android package
      # ----------------------------------------------------------

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              'namespace = "com.example.stelluriini"',
              'namespace = "com.example.stelluriini"'
          )

          text = text.replace(
              'applicationId = "com.example.stelluriini"',
              'applicationId = "com.example.stelluriini"'
          )

          if 'id "com.google.gms.google-services"' not in text:
              text = text.replace(
                  'id "dev.flutter.flutter-gradle-plugin"',
                  'id "dev.flutter.flutter-gradle-plugin"\n'
                  '    id "com.google.gms.google-services"'
              )

          path.write_text(text)
          PY

      # ----------------------------------------------------------
      # Firebase Google Services plugin
      # ----------------------------------------------------------

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")
          text = path.read_text()

          if 'com.google.gms.google-services' not in text:
              marker = 'id "org.jetbrains.kotlin.android"'

              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if marker in line:
                      lines.insert(
                          i + 1,
                          '    id "com.google.gms.google-services" '
                          'version "4.4.3" apply false'
                      )
                      break
              else:
                  raise SystemExit(
                      "Kotlin Android plugin not found"
                  )

              text = "\n".join(lines) + "\n"

          path.write_text(text)
          PY

      # ----------------------------------------------------------
      # Verify Firebase
      # ----------------------------------------------------------

      - name: Verify Firebase configuration
        run: |
          echo "Firebase package:"
          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json

          echo "Android applicationId:"
          grep -n "applicationId" \
            android/app/build.gradle

      # ----------------------------------------------------------
      # Stelluriini icon
      # ----------------------------------------------------------

      - name: Check Stelluriini icon
        run: |
          test -f stelluriini_icon.png

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create Android launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert stelluriini_icon.png \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert stelluriini_icon.png \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # ----------------------------------------------------------
      # App name
      # ----------------------------------------------------------

      - name: Set application name
        run: |
          sed -i \
            's/android:label="[^"]*"/android:label="Stelluriini"/' \
            android/app/src/main/AndroidManifest.xml

      # ----------------------------------------------------------
      # Flutter packages
      # ----------------------------------------------------------

      - name: Flutter pub get
        run: |
          flutter pub get

      # ----------------------------------------------------------
      # Remove generated example tests
      # ----------------------------------------------------------

      - name: Remove generated Flutter tests
        run: |
          rm -rf test

      # ----------------------------------------------------------
      # Analyze
      # ----------------------------------------------------------

      - name: Flutter analyze
        run: |
          flutter analyze

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Stelluriini APK
        run: |
          mkdir -p build

          flutter build apk --release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/Stelluriini.apk

      # ----------------------------------------------------------
      # Upload
      # ----------------------------------------------------------

      - name: Upload Stelluriini APK
        uses: actions/upload-artifact@v4
        with:
          name: Stelluriini
          path: build/Stelluriini.apk