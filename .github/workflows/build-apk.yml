name: Build Stelluriini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. Java
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. Android SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3.
      # It may try to install the obsolete "tools" package.
      # ==========================================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      # ==========================================================
      # 5. Install required Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing required Android SDK packages..."
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      # ==========================================================
      # 6. Verify Flutter Android project
      # ==========================================================
      - name: Verify Flutter Android project
        run: |
          echo "Checking Android project..."

          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt
          test -f android/app/build.gradle
          test -f android/build.gradle

          echo "Android project files found."

      # ==========================================================
      # 7. Verify Firebase configuration
      # ==========================================================
      - name: Verify Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 8. Verify application assets
      # ==========================================================
      - name: Verify application assets
        run: |
          if [ -d "assets" ]; then
            echo "Assets directory found."
            find assets -maxdepth 2 -type f | head -50
          else
            echo "No assets directory found."
          fi

      # ==========================================================
      # 9. Verify MainActivity uses Flutter V2 embedding
      # ==========================================================
      - name: Verify MainActivity Flutter V2 embedding
        run: |
          MAIN_ACTIVITY="android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt"

          echo "===== MainActivity.kt ====="
          cat "$MAIN_ACTIVITY"
          echo "==========================="

          if ! grep -q "io.flutter.embedding.android.FlutterActivity" "$MAIN_ACTIVITY"; then
            echo "ERROR: MainActivity does not use Flutter V2 embedding."
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterActivity" "$MAIN_ACTIVITY"; then
            echo "ERROR: Old Flutter V1 embedding detected."
            exit 1
          fi

          echo "Flutter V2 MainActivity verified."

      # ==========================================================
      # 10. Verify AndroidManifest Flutter V2 embedding
      # ==========================================================
      - name: Verify AndroidManifest Flutter V2 embedding
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"
          echo "================================"

          if ! grep -q "flutterEmbedding" "$MANIFEST"; then
            echo "ERROR: flutterEmbedding metadata not found."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "ERROR: Flutter V2 embedding value not found."
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterApplication" "$MANIFEST"; then
            echo "ERROR: Old Flutter V1 application detected."
            exit 1
          fi

          echo "Flutter V2 AndroidManifest verified."

      # ==========================================================
      # 11. Configure AndroidX
      # ==========================================================
      - name: Configure AndroidX
        run: |
          mkdir -p android/gradle

          if [ -f android/gradle.properties ]; then
            echo "Existing android/gradle.properties found."
          else
            touch android/gradle.properties
          fi

          if ! grep -q "^android.useAndroidX=true" android/gradle.properties; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" android/gradle.properties; then
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          echo "===== android/gradle.properties ====="
          cat android/gradle.properties
          echo "======================================"

      # ==========================================================
      # 12. Flutter clean
      # ==========================================================
      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 13. Flutter pub get
      # ==========================================================
      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 14. Generate launcher icons
      # ==========================================================
      - name: Generate launcher icons
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "flutter_launcher_icons not configured."
          fi

      # ==========================================================
      # 15. Remove temporary test pages if present
      # ==========================================================
      - name: Remove temporary test pages
        run: |
          rm -f lib/pages/minimal_test_page.dart
          rm -f lib/minimal_test_page.dart
          rm -f lib/pages/home/minimal_test_page.dart

          echo "Temporary test pages removed if they existed."

      # ==========================================================
      # 16. Flutter analyze
      # ==========================================================
      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 17. FINAL Android V2 embedding check
      #
      # This is intentionally immediately before the build.
      # It tells us exactly what Flutter sees at build time.
      # ==========================================================
      - name: Final Flutter V2 embedding check
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          MAIN_ACTIVITY="android/app/src/main/kotlin/com/example/stelluriini/MainActivity.kt"

          echo ""
          echo "=================================================="
          echo "FINAL ANDROID EMBEDDING CHECK"
          echo "=================================================="

          echo ""
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

          echo ""
          echo "--- MainActivity.kt ---"
          cat "$MAIN_ACTIVITY"

          echo ""
          echo "--- Checking manifest ---"

          if ! grep -q "flutterEmbedding" "$MANIFEST"; then
            echo "ERROR: flutterEmbedding is missing."
            exit 1
          fi

          if ! grep -q 'android:value="2"' "$MANIFEST"; then
            echo "ERROR: flutterEmbedding value 2 is missing."
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterApplication" "$MANIFEST"; then
            echo "ERROR: Flutter V1 application detected."
            exit 1
          fi

          echo ""
          echo "--- Checking MainActivity ---"

          if ! grep -q "io.flutter.embedding.android.FlutterActivity" "$MAIN_ACTIVITY"; then
            echo "ERROR: Flutter V2 FlutterActivity not found."
            exit 1
          fi

          if grep -q "io.flutter.app.FlutterActivity" "$MAIN_ACTIVITY"; then
            echo "ERROR: Flutter V1 FlutterActivity detected."
            exit 1
          fi

          echo ""
          echo "FINAL EMBEDDING CHECK PASSED."
          echo "=================================================="

      # ==========================================================
      # 18. Build APK
      # ==========================================================
      - name: Build release APK
        run: |
          flutter build apk --release

      # ==========================================================
      # 19. Verify APK
      # ==========================================================
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 20. Upload APK
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error