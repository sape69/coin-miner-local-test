name: Build and Test Stelluriini Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Analyze, Test and Build Release
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. FLUTTER
      # ==========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ==========================================================
      # 3. JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 4. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 5. VERIFY FIREBASE
      # ==========================================================

      - name: Verify Firebase configuration
        run: |
          FILE="android/app/google-services.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Firebase configuration missing:"
            echo "$FILE"
            exit 1
          fi

          echo "Firebase configuration found."

      # ==========================================================
      # 6. VERIFY APPLICATION ID
      # ==========================================================

      - name: Verify application ID
        run: |
          FILE="android/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          grep -n "applicationId" "$FILE" || true

          if ! grep -q 'applicationId = "com.stelluriini.app"' "$FILE"; then
            echo "ERROR: Wrong applicationId."
            echo "Expected: com.stelluriini.app"
            exit 1
          fi

          echo "Application ID OK."

      # ==========================================================
      # 7. FLUTTER CLEAN
      # ==========================================================

      - name: Flutter clean
        run: |
          flutter clean

      # ==========================================================
      # 8. PUB GET
      # ==========================================================

      - name: Flutter pub get
        run: |
          flutter pub get

      # ==========================================================
      # 9. RESTORE STELLURIINI RELEASE KEYSTORE FROM SECRET
      # ==========================================================

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STELLURIINI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "=================================================="
          echo "RESTORING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          mkdir -p android

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: STELLURIINI_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/stelluriini-upload-keystore.jks

          chmod 600 android/stelluriini-upload-keystore.jks

          if [ ! -s "android/stelluriini-upload-keystore.jks" ]; then
            echo "ERROR: Release keystore could not be restored."
            exit 1
          fi

          echo ""
          echo "Release keystore restored successfully."
          echo "Keystore file is present and ready for signing."

      # ==========================================================
      # 10. GENERATE APP ICON
      # ==========================================================

      - name: Generate app icon
        run: |
          if [ ! -f assets/images/stelluriini_logo.png ]; then
            echo "ERROR: Stelluriini logo missing."
            exit 1
          fi

          dart run flutter_launcher_icons

      # ==========================================================
      # 11. FLUTTER ANALYZE
      # ==========================================================

      - name: Flutter analyze
        run: |
          flutter analyze

      # ==========================================================
      # 12. FLUTTER TEST
      # ==========================================================

      - name: Flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found."
            echo "Skipping Flutter unit/widget tests."
          fi

      # ==========================================================
      # 13. VERIFY RELEASE KEYSTORE
      # ==========================================================

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
        run: |
          echo "=================================================="
          echo "VERIFYING STELLURIINI RELEASE KEYSTORE"
          echo "=================================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/stelluriini-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias stelluriini-upload

          echo ""
          echo "Release keystore verification PASSED."

      # ==========================================================
      # 14. BUILD RELEASE APP BUNDLE
      # ==========================================================

      - name: Build release App Bundle
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          echo "=================================================="
          echo "BUILDING STELLURIINI RELEASE APP BUNDLE"
          echo "=================================================="

          if [ -z "$STELLURIINI_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$STELLURIINI_KEY_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEY_PASSWORD secret is missing."
            exit 1
          fi

          flutter build appbundle --release

      # ==========================================================
      # 15. VERIFY APP BUNDLE
      # ==========================================================

      - name: Verify App Bundle
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: App Bundle was not created."
            exit 1
          fi

          echo ""
          echo "App Bundle successfully created:"
          ls -lh "$AAB"

      # ==========================================================
      # 16. BUILD RELEASE APK
      # ==========================================================

      - name: Build release APK
        env:
          STELLURIINI_KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          STELLURIINI_KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          echo "=================================================="
          echo "BUILDING STELLURIINI RELEASE APK"
          echo "=================================================="

          flutter build apk --release

      # ==========================================================
      # 17. VERIFY APK
      # ==========================================================

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================================
      # 18. UPLOAD RELEASE FILES
      # ==========================================================

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ==========================================================
      # 19. REMOVE TEMPORARY RELEASE KEYSTORE
      # ==========================================================

      - name: Remove temporary release keystore
        if: always()
        run: |
          rm -f android/stelluriini-upload-keystore.jks
          echo "Temporary release keystore removed from runner."

      # ==========================================================
      # 20. BUILD SUMMARY
      # ==========================================================

      - name: Build summary
        run: |
          echo ""
          echo "=================================================="
          echo "🐱 STELLURIINI RELEASE BUILD SUCCESSFUL"
          echo "=================================================="
          echo ""
          echo "Flutter analyze:     PASSED"
          echo "Flutter tests:       PASSED / SKIPPED"
          echo "Release keystore:    VERIFIED"
          echo "Release signing:     ENABLED"
          echo "App Bundle:          PASSED"
          echo "APK build:           PASSED"
          echo ""
          echo "Google Play Bundle:"
          echo "build/app/outputs/bundle/release/app-release.aab"
          echo ""
          echo "Test APK:"
          echo "build/app/outputs/flutter-apk/app-release.apk"
          echo ""
          echo "=================================================="