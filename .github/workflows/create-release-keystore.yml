name: Create Stelluriini Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    name: Create Release Keystore
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. CREATE KEYSTORE DIRECTORY
      # ==========================================================

      - name: Create signing directory
        run: |
          mkdir -p android

      # ==========================================================
      # 4. GENERATE RELEASE KEYSTORE
      # ==========================================================

      - name: Generate Stelluriini release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.STELLURIINI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: STELLURIINI_KEY_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -genkeypair \
            -v \
            -keystore android/stelluriini-upload-keystore.jks \
            -alias stelluriini-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Stelluriini, OU=Stelluriini, O=Stelluriini, L=Finland, ST=Uusimaa, C=FI"

      # ==========================================================
      # 5. VERIFY KEYSTORE
      # ==========================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STELLURIINI_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f android/stelluriini-upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/stelluriini-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Stelluriini release keystore created successfully."

      # ==========================================================
      # 6. UPLOAD KEYSTORE
      # ==========================================================

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: stelluriini-release-keystore
          path: android/stelluriini-upload-keystore.jks
          if-no-files-found: error

          # Keep the artifact available for future APK builds.
          retention-days: 30

      # ==========================================================
      # 7. SUMMARY
      # ==========================================================

      - name: Summary
        run: |
          echo ""
          echo "=================================================="
          echo "🐱 STELLURIINI RELEASE KEYSTORE CREATED"
          echo "=================================================="
          echo ""
          echo "Alias:"
          echo "stelluriini-upload"
          echo ""
          echo "Keystore:"
          echo "stelluriini-upload-keystore.jks"
          echo ""
          echo "Artifact:"
          echo "stelluriini-release-keystore"
          echo ""
          echo "Retention:"
          echo "30 days"
          echo ""
          echo "=================================================="