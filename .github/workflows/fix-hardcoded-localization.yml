          # ============================================================
          # ADD MISSING TRANSLATION KEYS
          # ============================================================

          def add_translation_keys(path, values):
              content = path.read_text(encoding="utf-8")

              additions = []

              for key, value in values.items():
                  pattern = r"['\"]" + re.escape(key) + r"['\"]\s*:"

                  if re.search(pattern, content):
                      continue

                  escaped = (
                      value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                  )

                  additions.append(
                      f"  '{key}': '{escaped}',"
                  )

              if not additions:
                  return

              matches = list(re.finditer(r"\n\};\s*$", content))

              if not matches:
                  raise RuntimeError(
                      f"Translation map end not found: {path}"
                  )

              position = matches[-1].start()

              content = (
                  content[:position]
                  + "\n"
                  + "\n".join(additions)
                  + content[position:]
              )

              path.write_text(
                  content,
                  encoding="utf-8",
              )

          for language, values in translations.items():
              path = LANG_DIR / f"{language}.dart"

              if not path.exists():
                  raise RuntimeError(
                      f"Missing language file: {path}"
                  )

              add_translation_keys(
                  path,
                  values,
              )

          # ============================================================
          # ACCOUNT DELETION PAGE
          # ============================================================

          path = ROOT / "pages/account/account_deletion_page.dart"
          content = path.read_text(encoding="utf-8")

          if "import '../../localization.dart';" not in content:
              content = content.replace(
                  "import 'package:url_launcher/url_launcher.dart';",
                  "import 'package:url_launcher/url_launcher.dart';\n"
                  "\n"
                  "import '../../localization.dart';",
                  1,
              )

          if "final String languageCode;" not in content:
              content = re.sub(
                  r"(class AccountDeletionPage extends StatelessWidget \{\s*)",
                  r"\1  final String languageCode;\n\n",
                  content,
                  count=1,
              )

          constructor_pattern = (
              r"const AccountDeletionPage\(\{\s*"
              r"super\.key,\s*"
              r"required this\.onDeleteAccountPressed,\s*"
              r"\}\);"
          )

          constructor_replacement = """const AccountDeletionPage({
    super.key,
    required this.languageCode,
    required this.onDeleteAccountPressed,
  });"""

          content, constructor_count = re.subn(
              constructor_pattern,
              constructor_replacement,
              content,
              count=1,
          )

          if constructor_count == 0:
              # Already localized constructor is acceptable.
              if "required this.languageCode" not in content:
                  raise RuntimeError(
                      "AccountDeletionPage constructor not found."
                  )

          content = content.replace(
              "Widget _buildInAppDeleteCard()",
              "Widget _buildInAppDeleteCard(AppLocalizations l)",
              1,
          )

          content = content.replace(
              "Widget _buildExternalRequestCard()",
              "Widget _buildExternalRequestCard(AppLocalizations l)",
              1,
          )

          content = content.replace(
              "Widget _buildInformationCard()",
              "Widget _buildInformationCard(AppLocalizations l)",
              1,
          )

          replacements = {
              "'Delete your account'":
                  "l.get('deleteYourAccount')",

              "'Delete Account'":
                  "l.get('deleteAccountButton')",

              "'Cannot access the app?'":
                  "l.get('cannotAccessApp')",

              "'Open Account Deletion Page'":
                  "l.get('openAccountDeletionPage')",

              "'Account Deletion'":
                  "l.get('accountDeletion')",

              "'Stelluriini Account'":
                  "l.get('accountDeletionAppTitle')",

              "'Manage your account and deletion options'":
                  "l.get('accountDeletionSubtitle')",
          }

          for old, new in replacements.items():
              content = content.replace(
                  old,
                  new,
              )

          content = re.sub(
              r"'You can permanently delete your Stelluriini account\s*'"
              r"\s*'and associated account data directly from the app\.'",
              "l.get('deleteAccountDescription')",
              content,
              count=1,
          )

          content = re.sub(
              r"'If you cannot access Stelluriini, you can open our\s*'"
              r"\s*'external account deletion page and submit a deletion request\.'",
              "l.get('cannotAccessAppDescription')",
              content,
              count=1,
          )

          content = re.sub(
              r"const Text\(\s*"
              r"'Account deletion is permanent\. Your Stelluriini\s*'"
              r"\s*'account and associated data cannot be restored after deletion\.',",
              "Text(\n"
              "          l.get('accountDeletionPermanent'),",
              content,
              count=1,
          )

          build_pattern = (
              r"(@override\s+"
              r"(?:const\s+)?Widget\s+build\(BuildContext context\)\s*\{)"
          )

          if "AppLocalizations(languageCode)" not in content:
              content, build_count = re.subn(
                  build_pattern,
                  r"\1\n"
                  r"    final AppLocalizations l = "
                  r"AppLocalizations(languageCode);",
                  content,
                  count=1,
              )

              if build_count == 0:
                  raise RuntimeError(
                      "AccountDeletionPage build method not found."
                  )

          content = content.replace(
              "_buildInAppDeleteCard(),",
              "_buildInAppDeleteCard(l),",
          )

          content = content.replace(
              "_buildExternalRequestCard(),",
              "_buildExternalRequestCard(l),",
          )

          content = content.replace(
              "_buildInformationCard(),",
              "_buildInformationCard(l),",
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              "AccountDeletionPage localization applied."
          )

          # ============================================================
          # HOME PAGE
          # ============================================================

          path = ROOT / "pages/home/home_page.dart"
          content = path.read_text(encoding="utf-8")

          account_pattern = (
              r"AccountDeletionPage\(\s*"
              r"onDeleteAccountPressed:\s*"
              r"_showDeleteAccountConfirmation,\s*"
              r"\)"
          )

          account_replacement = """AccountDeletionPage(
            languageCode:
                widget.languageCode,
            onDeleteAccountPressed:
                _showDeleteAccountConfirmation,
          )"""

          content, account_count = re.subn(
              account_pattern,
              account_replacement,
              content,
              count=1,
          )

          if account_count == 0:
              if "languageCode:" not in content or "AccountDeletionPage(" not in content:
                  raise RuntimeError(
                      "HomePage AccountDeletionPage call not found."
                  )

          timer_pattern = (
              r"timerLabel:\s*_t\(\s*"
              r"['\"]miningTimeRemaining['\"]\s*"
              r"\),"
          )

          timer_replacement = """timerLabel:
              _localization.getWithParams(
            'miningTimeRemaining',
            params: {
              'time': _formatDuration(
                _miningRemainingMs,
              ),
            },
          ),"""

          content, timer_count = re.subn(
              timer_pattern,
              timer_replacement,
              content,
              count=1,
          )

          if timer_count == 0:
              if "_localization.getWithParams" not in content or "miningTimeRemaining" not in content:
                  raise RuntimeError(
                      "HomePage miningTimeRemaining call not found."
                  )

          footer_pattern = (
              r"const\s+Text\(\s*"
              r"['\"]Stella is mining the future\.['\"],\s*"
              r"textAlign:\s*TextAlign\.center,\s*"
              r"style:\s*TextStyle\(\s*"
              r"color:\s*secondaryTextColor,\s*"
              r"fontSize:\s*13,\s*"
              r"fontWeight:\s*FontWeight\.w500,\s*"
              r"\),\s*"
              r"\)"
          )

          footer_replacement = """Text(
          _t('footerMiningFuture'),
          textAlign: TextAlign.center,
          style: const TextStyle(
            color: secondaryTextColor,
            fontSize: 13,
            fontWeight: FontWeight.w500,
          ),
        )"""

          content, footer_count = re.subn(
              footer_pattern,
              footer_replacement,
              content,
              count=1,
          )

          if footer_count == 0:
              if "footerMiningFuture" not in content:
                  raise RuntimeError(
                      "HomePage footer not found."
                  )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              "HomePage localization applied."
          )

          # ============================================================
          # STELLA MINING DAYS
          # ============================================================

          path = ROOT / "pages/home/stella_mining_days_card.dart"
          content = path.read_text(encoding="utf-8")

          content = content.replace(
              "'STELLA MINING DAYS'",
              "'STELLAのマイニング日数'",
          )

          content = content.replace(
              "DAY $currentDay",
              "${_dayLabel(language)} $currentDay",
          )

          if "String _dayLabel(" not in content:
              marker = "  String _currentLabel("

              index = content.find(marker)

              if index == -1:
                  raise RuntimeError(
                      "Stella Mining Days _currentLabel method not found."
                  )

              method = """  String _dayLabel(
    String language,
  ) {
    switch (language) {
      case 'fi':
        return 'PÄIVÄ';
      case 'de':
        return 'TAG';
      case 'es':
        return 'DÍA';
      case 'fr':
        return 'JOUR';
      case 'zh':
        return '天';
      case 'vi':
        return 'NGÀY';
      case 'ja':
        return '日';
      case 'en':
      default:
        return 'DAY';
    }
  }

"""

              content = (
                  content[:index]
                  + method
                  + content[index:]
              )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              "Stella Mining Days localization applied."
          )

          # ============================================================
          # DAILY REWARD CARD
          # ============================================================

          path = ROOT / "pages/home/daily_reward_card.dart"
          content = path.read_text(encoding="utf-8")

          if "import '../../localization.dart';" not in content:
              content = content.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\n"
                  "import '../../localization.dart';",
                  1,
              )

          if "final String languageCode;" not in content:
              content = content.replace(
                  "final bool dailyClaimed;",
                  "final bool dailyClaimed;\n"
                  "  final String languageCode;",
                  1,
              )

          if "this.languageCode = 'en'," not in content:
              content = content.replace(
                  "required this.dailyClaimed,\n"
                  "    required this.onPressed,",
                  "required this.dailyClaimed,\n"
                  "    this.languageCode = 'en',\n"
                  "    required this.onPressed,",
                  1,
              )

          if "AppLocalizations(languageCode)" not in content:
              content = content.replace(
                  "Widget build(BuildContext context) {",
                  "Widget build(BuildContext context) {\n"
                  "    final AppLocalizations l = "
                  "AppLocalizations(languageCode);",
                  1,
              )

          content = content.replace(
              "'Boost Stella’s mining power 🐱⛏️'",
              "l.get('dailyMiningPowerBoost')",
          )

          content = content.replace(
              "'Boost Stella's mining power 🐱⛏️'",
              "l.get('dailyMiningPowerBoost')",
          )

          content = content.replace(
              "'Daily mining power boost'",
              "l.get('dailyMiningPowerBoostShort')",
          )

          content = content.replace(
              "'✓ DONE'",
              "'✓ ${l.get('done')}'",
          )

          content = content.replace(
              "'CLAIMING...'",
              "l.get('claiming')",
          )

          content = content.replace(
              "'CLAIMED TODAY'",
              "l.get('claimedToday')",
          )

          content = content.replace(
              "'CLAIM +1 HASH RATE'",
              "l.get('claimHashRate')",
          )

          content = content.replace(
              "'Come back tomorrow for another Hash Rate boost 🐱'",
              "l.get('comeBackTomorrow')",
          )

          content = content.replace(
              "'Claim your daily bonus to increase mining power'",
              "l.get('claimDailyBonusInfo')",
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              "DailyRewardCard localization applied."
          )

          print(
              "All localization source changes completed."
          )
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Verify localization changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("lib/pages/account/account_deletion_page.dart"),
              Path("lib/pages/home/home_page.dart"),
              Path("lib/pages/home/stella_mining_days_card.dart"),
              Path("lib/pages/home/daily_reward_card.dart"),
          ]

          for path in files:
              if not path.exists():
                  raise SystemExit(
                      f"Missing file: {path}"
                  )

          account = Path(
              "lib/pages/account/account_deletion_page.dart"
          ).read_text(encoding="utf-8")

          home = Path(
              "lib/pages/home/home_page.dart"
          ).read_text(encoding="utf-8")

          mining_days = Path(
              "lib/pages/home/stella_mining_days_card.dart"
          ).read_text(encoding="utf-8")

          daily = Path(
              "lib/pages/home/daily_reward_card.dart"
          ).read_text(encoding="utf-8")

          required_checks = {
              "AccountDeletionPage languageCode":
                  "final String languageCode;" in account,

              "AccountDeletionPage localization":
                  "AppLocalizations(languageCode)" in account,

              "HomePage AccountDeletion language":
                  "languageCode:" in home and
                  "AccountDeletionPage(" in home,

              "HomePage mining timer":
                  "getWithParams(" in home and
                  "miningTimeRemaining" in home,

              "HomePage footer localization":
                  "footerMiningFuture" in home,

              "Mining Days localization":
                  "_dayLabel(language)" in mining_days,

              "DailyRewardCard localization":
                  "AppLocalizations(languageCode)" in daily,
          }

          failed = [
              name
              for name, result in required_checks.items()
              if not result
          ]

          if failed:
              print("Verification failed:")
              for item in failed:
                  print(f" - {item}")
              raise SystemExit(1)

          print(
              "Localization verification passed."
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/localization/languages/*.dart \
            lib/pages/account/account_deletion_page.dart \
            lib/pages/home/home_page.dart \
            lib/pages/home/stella_mining_days_card.dart \
            lib/pages/home/daily_reward_card.dart

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "Fix hard-coded UI localization"
          git push