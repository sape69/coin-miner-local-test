          )

          content = path.read_text(
              encoding="utf-8"
          )

          old = """  String _currentLabel(
    String language,
  ) {
    switch (language) {
      case 'fi':
        return 'LOUHITAAN NYT';

      case 'de':
        return 'JETZT MINING';

      case 'es':
        return 'MINANDO AHORA';

      case 'fr':
        return 'MINAGE EN COURS';

      case 'zh':
        return '正在挖矿';

      case 'vi':
        return 'ĐANG ĐÀO';

      case 'ja':
        return '現在マイニング中';

      case 'en':
      default:
        return 'MINING NOW';
    }
  }
"""

          new = """  String _currentLabel(
    String language,
  ) {
    switch (language) {
      case 'fi':
        return 'LOUHITAAN NYT';

      case 'de':
        return 'JETZT MINING';

      case 'es':
        return 'MINANDO AHORA';

      case 'fr':
        return 'MINAGE EN COURS';

      case 'zh':
        return '正在挖矿';

      case 'vi':
        return 'ĐANG ĐÀO';

      case 'ja':
        return '現在マイニング中';

      case 'en':
      default:
        return 'MINING NOW';
    }
  }

  String _dayLabel(
    String language,
  ) {
    switch (language) {
      case 'fi':
        return 'PÄIVÄ';

      case 'de':
        return 'TAG';

      case 'es':
        return 'DÍA';

      case 'fr':
        return 'JOUR';

      case 'zh':
        return '天';

      case 'vi':
        return 'NGÀY';

      case 'ja':
        return '日';

      case 'en':
      default:
        return 'DAY';
    }
  }
"""

          if old not in content:
              raise RuntimeError(
                  "Could not find current label block."
              )

          content = content.replace(
              old,
              new,
              1,
          )

          content = content.replace(
              "return 'STELLA MINING DAYS';",
              "return 'STELLAのマイニング日数';",
              1,
          )

          content = content.replace(
              "'${_currentLabel(language)} · DAY $currentDay'",
              "'${_currentLabel(language)} · ${_dayLabel(language)} $currentDay'",
              1,
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print(
              "Fixed Stella mining days localization."
          )

