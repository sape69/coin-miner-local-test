              "dailyMiningPowerBoostShort": "毎日のマイニングパワー強化",
              "done": "完了",
              "claiming": "取得中...",
              "claimedToday": "本日取得済み",
              "claimHashRate": "+1 HASH RATEを取得",
              "comeBackTomorrow": "明日また来て新しいHash Rateボーナスを受け取りましょう 🐱",
