      - name: Verify no known hard-coded English UI remains
        shell: python
        run: |
          from pathlib import Path

          checks = {
              "lib/pages/account/account_deletion_page.dart": [
                  "Delete your account",
                  "Delete Account",
                  "Cannot access the app?",
                  "Open Account Deletion Page",
                  "Account Deletion",
                  "Manage your account and deletion options",
              ],
              "lib/pages/home/home_page.dart": [
                  "Stella is mining the future.",
              ],
              "lib/pages/home/daily_reward_card.dart": [
                  "Boost Stella’s mining power",
                  "Daily mining power boost",
                  "CLAIMING...",
                  "CLAIMED TODAY",
                  "CLAIM +1 HASH RATE",
                  "Come back tomorrow for another Hash Rate boost",
                  "Claim your daily bonus to increase mining power",
              ],
          }

          errors = []

          for filename, forbidden in checks.items():
              content = Path(filename).read_text(
                  encoding="utf-8"
              )

              for value in forbidden:
                  if value in content:
                      errors.append(
                          f"{filename}: {value}"
                      )

          if errors:
              print("Hard-coded English UI still found:")
              for error in errors:
                  print(error)

              raise SystemExit(1)

          print(
              "Known hard-coded English UI strings were removed."
          )

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/localization/languages/*.dart \
            lib/pages/account/account_deletion_page.dart \
            lib/pages/home/home_page.dart \
            lib/pages/home/stella_mining_days_card.dart \
            lib/pages/home/daily_reward_card.dart

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "Fix hard-coded UI localization"
          git push