              "accountDeletion": "アカウント削除",
              "accountDeletionAppTitle": "Stelluriiniアカウント",
              "accountDeletionSubtitle": "アカウントと削除オプションを管理",
              "deleteYourAccount": "アカウントを削除",
              "deleteAccountDescription": "アプリからStelluriiniアカウントと関連データを完全に削除できます。",
              "deleteAccountButton": "アカウントを削除",
              "cannotAccessApp": "アプリにアクセスできませんか？",
              "cannotAccessAppDescription": "Stelluriiniにアクセスできない場合は、外部のアカウント削除ページを開いて削除リクエストを送信できます。",
              "openAccountDeletionPage": "アカウント削除ページを開く",
