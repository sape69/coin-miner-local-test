name: Fix Hardcoded UI Localization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hardcoded-localization:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix localization keys
