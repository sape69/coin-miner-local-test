                  "claimDailyBonusInfo": "毎日のボーナスを受け取ってマイニングパワーを増やしましょう",
              },
          }

          def add_missing_keys(path, values):
              content = path.read_text(encoding="utf-8")

              additions = []

              for key, value in values.items():
                  if f"'{key}':" in content:
                      continue

                  escaped = (
                      value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                  )

                  additions.append(
                      f"  '{key}':\n"
                      f"      '{escaped}',\n"
                  )

              if not additions:
                  return

              marker = "\n};"

              if marker not in content:
                  raise RuntimeError(
                      f"Could not find map end in {path}"
                  )

              block = (
                  "\n\n"
                  "  // ============================================================\n"
                  "  // 🌍 HARD-CODED UI LOCALIZATION FIXES\n"
                  "  // ============================================================\n\n"
                  + "\n".join(additions)
              )

              content = content.replace(
                  marker,
                  block + marker,
                  1,
              )

              path.write_text(
                  content,
                  encoding="utf-8",
              )

          for language, values in translations.items():
              path = base / f"{language}.dart"

              if not path.exists():
                  raise FileNotFoundError(path)

              add_missing_keys(path, values)

              print(f"Localization keys checked: {path}")

      - name: Fix Stella mining days card
        shell: python
