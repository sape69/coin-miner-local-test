            },
          }

          def add_keys(path, values):
              content = path.read_text(encoding="utf-8")
              additions = []

              for key, value in values.items():
                  if re.search(
                      r"['\"]" + re.escape(key) + r"['\"]\s*:",
                      content,
                  ):
                      continue

                  escaped = (
                      value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                  )

                  additions.append(
                      f"  '{key}': '{escaped}',"
                  )

              if not additions:
                  return

              marker = "\n};"

              if marker not in content:
                  raise RuntimeError(
                      f"Translation map end not found: {path}"
                  )

              content = content.replace(
                  marker,
                  "\n" + "\n".join(additions) + marker,
                  1,
              )

              path.write_text(
                  content,
                  encoding="utf-8",
              )

          for language, values in translations.items():
              path = lang_dir / f"{language}.dart"

              if not path.exists():
                  raise RuntimeError(
                      f"Missing language file: {path}"
                  )

              add_keys(path, values)

          # ============================================================
          # ACCOUNT DELETION PAGE
          # ============================================================

          path = root / "pages/account/account_deletion_page.dart"
          content = path.read_text(encoding="utf-8")

          if "import '../../localization.dart';" not in content:
              content = content.replace(
                  "import 'package:url_launcher/url_launcher.dart';",
                  "import 'package:url_launcher/url_launcher.dart';\n\nimport '../../localization.dart';",
                  1,
              )

          if "final String languageCode;" not in content:
              content = content.replace(
                  "class AccountDeletionPage extends StatelessWidget {",
                  "class AccountDeletionPage extends StatelessWidget {\n"
                  "  final String languageCode;",
                  1,
              )

          content = content.replace(
              "required this.onDeleteAccountPressed,\n});",
              "required this.languageCode,\n"
              "    required this.onDeleteAccountPressed,\n"
              "  });",
              1,
          )

          content = content.replace(
              "Widget _buildInAppDeleteCard() {",
              "Widget _buildInAppDeleteCard(AppLocalizations l) {",
              1,
          )

          content = content.replace(
              "Widget _buildExternalRequestCard() {",
              "Widget _buildExternalRequestCard(AppLocalizations l) {",
              1,
          )

          content = content.replace(
              "Widget _buildInformationCard() {",
              "Widget _buildInformationCard(AppLocalizations l) {",
              1,
          )

          replacements = {
              "'Delete your account'":
                  "l.get('deleteYourAccount')",
              "'Delete Account'":
                  "l.get('deleteAccountButton')",
              "'Cannot access the app?'":
                  "l.get('cannotAccessApp')",
              "'Open Account Deletion Page'":
                  "l.get('openAccountDeletionPage')",
              "'Account Deletion'":
                  "l.get('accountDeletion')",
              "'Stelluriini Account'":
                  "l.get('accountDeletionAppTitle')",
              "'Manage your account and deletion options'":
                  "l.get('accountDeletionSubtitle')",
          }

          for old, new in replacements.items():
              content = content.replace(old, new)

          content = content.replace(
              "'You can permanently delete your Stelluriini account '\n"
              "'and associated account data directly from the app.'",
              "l.get('deleteAccountDescription')",
              1,
          )

          content = content.replace(
              "'If you cannot access Stelluriini, you can open our '\n"
              "'external account deletion page and submit a deletion request.'",
              "l.get('cannotAccessAppDescription')",
              1,
          )

          content = content.replace(
              "const Text(\n"
              "          'Account deletion is permanent. Your Stelluriini '\n"
              "          'account and associated data cannot be restored after deletion.',",
              "Text(\n"
              "          l.get('accountDeletionPermanent'),",
              1,
          )

          marker = "@override\n  Widget build(BuildContext context) {"

          if marker not in content:
              marker = "@override\nWidget build(BuildContext context) {"

          if marker not in content:
              raise RuntimeError(
                  "AccountDeletionPage build method not found."
              )

          if "final AppLocalizations l = AppLocalizations(languageCode);" not in content:
              content = content.replace(
                  marker,
                  marker + "\n"
                  "    final AppLocalizations l = "
                  "AppLocalizations(languageCode);",
                  1,
              )

          content = content.replace(
              "_buildInAppDeleteCard(),",
              "_buildInAppDeleteCard(l),",
              1,
          )

          content = content.replace(
              "_buildExternalRequestCard(),",
              "_buildExternalRequestCard(l),",
              1,
          )

          content = content.replace(
              "_buildInformationCard(),",
              "_buildInformationCard(l),",
              1,
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          # ============================================================
          # HOME PAGE
          # ============================================================

          path = root / "pages/home/home_page.dart"
          content = path.read_text(encoding="utf-8")

          account_pattern = (
              r"AccountDeletionPage\(\s*"
              r"onDeleteAccountPressed:\s*"
              r"_showDeleteAccountConfirmation,\s*"
              r"\)"
          )

          account_replacement = """AccountDeletionPage(
          languageCode:
              widget.languageCode,
          onDeleteAccountPressed:
              _showDeleteAccountConfirmation,
        )"""

          content, account_count = re.subn(
              account_pattern,
              account_replacement,
              content,
              count=1,
          )

          if account_count != 1:
              raise RuntimeError(
                  "HomePage AccountDeletionPage call not found."
              )

          old = "timerLabel: _t('miningTimeRemaining'),"

          new = """timerLabel:
              _localization.getWithParams(
            'miningTimeRemaining',
            params: {
              'time': _formatDuration(
                _miningRemainingMs,
              ),
            },
          ),"""

          if old not in content:
              raise RuntimeError(
                  "HomePage miningTimeRemaining call not found."
              )

          content = content.replace(
              old,
              new,
              1,
          )

          footer_pattern = (
              r"const Text\(\s*"
              r"'Stella is mining the future\.',\s*"
              r"textAlign:\s*TextAlign\.center,\s*"
              r"style:\s*TextStyle\(\s*"
              r"color:\s*secondaryTextColor,\s*"
              r"fontSize:\s*13,\s*"
              r"fontWeight:\s*FontWeight\.w500,\s*"
              r"\),\s*"
              r"\)"
          )

          footer_replacement = """Text(
          _t('footerMiningFuture'),
          textAlign: TextAlign.center,
          style: const TextStyle(
            color: secondaryTextColor,
            fontSize: 13,
            fontWeight: FontWeight.w500,
          ),
        )"""

          content, footer_count = re.subn(
              footer_pattern,
              footer_replacement,
              content,
              count=1,
          )

          if footer_count != 1:
              raise RuntimeError(
                  "HomePage footer not found."
              )

          path.write_text(
              content,
              encoding="utf-8",
          )

          # ============================================================
          # STELLA MINING DAYS
          # ============================================================

          path = root / "pages/home/stella_mining_days_card.dart"
          content = path.read_text(encoding="utf-8")

          if "'STELLA MINING DAYS'" in content:
              content = content.replace(
                  "'STELLA MINING DAYS'",
                  "'STELLAのマイニング日数'",
                  1,
              )

          dollar = chr(36)

          old = "DAY " + dollar + "currentDay"
          new = dollar + "{_dayLabel(language)} " + dollar + "currentDay"

          if old in content:
              content = content.replace(
                  old,
                  new,
                  1,
              )

          if "String _dayLabel(" not in content:
              marker = "  String _currentLabel("
              index = content.find(marker)

              if index < 0:
                  raise RuntimeError(
                      "Stella Mining Days _currentLabel not found."
                  )

              method = """  String _dayLabel(
    String language,
  ) {
    switch (language) {
      case 'fi':
        return 'PÄIVÄ';
      case 'de':
        return 'TAG';
      case 'es':
        return 'DÍA';
      case 'fr':
        return 'JOUR';
      case 'zh':
        return '天';
      case 'vi':
        return 'NGÀY';
      case 'ja':
        return '日';
      case 'en':
      default:
        return 'DAY';
    }
  }

"""

              content = (
                  content[:index]
                  + method
                  + content[index:]
              )

          path.write_text(
              content,
              encoding="utf-8",
          )

          # ============================================================
          # DAILY REWARD CARD
          # ============================================================

          path = root / "pages/home/daily_reward_card.dart"
          content = path.read_text(encoding="utf-8")

          if "import '../../localization.dart';" not in content:
              content = content.replace(
                  "import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\n"
                  "import '../../localization.dart';",
                  1,
              )

          if "final String languageCode;" not in content:
              content = content.replace(
                  "final bool dailyClaimed;",
                  "final bool dailyClaimed;\n"
                  "  final String languageCode;",
                  1,
              )

          if "this.languageCode = 'en'," not in content:
              content = content.replace(
                  "required this.dailyClaimed,\n"
                  "    required this.onPressed,",
                  "required this.dailyClaimed,\n"
                  "    this.languageCode = 'en',\n"
                  "    required this.onPressed,",
                  1,
              )

          if "final AppLocalizations l = AppLocalizations(languageCode);" not in content:
              content = content.replace(
                  "Widget build(BuildContext context) {",
                  "Widget build(BuildContext context) {\n"
                  "    final AppLocalizations l = "
                  "AppLocalizations(languageCode);",
                  1,
              )

          content = content.replace(
              "Text(\n"
              "                      'Boost Stella’s mining power 🐱⛏️',",
              "Text(\n"
              "                      l.get('dailyMiningPowerBoost'),",
              1,
          )

          content = content.replace(
              "Text(\n"
              "                        'Daily mining power boost',",
              "Text(\n"
              "                        l.get('dailyMiningPowerBoostShort'),",
              1,
          )

          content = content.replace(
              "child: const Text(\n"
              "                    '✓ DONE',",
              "child: Text(\n"
              "                    '✓ ${l.get('done')}',",
              1,
          )

          content = content.replace(
              """dailyLoading
                    ? 'CLAIMING...'
                    : dailyClaimed
                        ? 'CLAIMED TODAY'
                        : 'CLAIM +1 HASH RATE'""",
              """dailyLoading
                    ? l.get('claiming')
                    : dailyClaimed
                        ? l.get('claimedToday')
                        : l.get('claimHashRate')""",
              1,
          )

          content = content.replace(
              """dailyClaimed
                      ? 'Come back tomorrow for another Hash Rate boost 🐱'
                      : 'Claim your daily bonus to increase mining power'""",
              """dailyClaimed
                      ? l.get('comeBackTomorrow')
                      : l.get('claimDailyBonusInfo')""",
              1,
          )

          path.write_text(
              content,
              encoding="utf-8",
          )

          print("Localization source changes prepared.")

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Verify hard-coded English
        shell: python
        run: |
          from pathlib import Path

          checks = {
              "lib/pages/account/account_deletion_page.dart": [
                  "Delete your account",
                  "Delete Account",
                  "Cannot access the app?",
                  "Open Account Deletion Page",
                  "Account Deletion",
                  "Manage your account and deletion options",
              ],
              "lib/pages/home/home_page.dart": [
                  "Stella is mining the future.",
                  "timerLabel: _t('miningTimeRemaining'),",
              ],
              "lib/pages/home/stella_mining_days_card.dart": [
                  "DAY $currentDay",
                  "'STELLA MINING DAYS'",
              ],
              "lib/pages/home/daily_reward_card.dart": [
                  "Boost Stella’s mining power",
                  "Daily mining power boost",
                  "CLAIMING...",
                  "CLAIMED TODAY",
                  "CLAIM +1 HASH RATE",
                  "Come back tomorrow for another Hash Rate boost",
                  "Claim your daily bonus to increase mining power",
              ],
          }

          errors = []

          for filename, values in checks.items():
              content = Path(filename).read_text(
                  encoding="utf-8"
              )

              for value in values:
                  if value in content:
                      errors.append(
                          filename + ": " + value
                      )

          if errors:
              print("Hard-coded English strings remain:")
              print("\n".join(errors))
              raise SystemExit(1)

          print(
              "Known hard-coded English strings are gone."
          )

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lib/localization/languages/*.dart \
            lib/pages/account/account_deletion_page.dart \
            lib/pages/home/home_page.dart \
            lib/pages/home/stella_mining_days_card.dart \
            lib/pages/home/daily_reward_card.dart

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "Fix hard-coded UI localization"
          git push