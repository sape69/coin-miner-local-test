name: Fix Hardcoded UI Localization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-localization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Finnish localization
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/localization/languages/fi.dart")

          if not path.exists():
              raise RuntimeError(
                  f"Localization file not found: {path}"
              )

          content = path.read_text(encoding="utf-8")

          replacements = {
              "'stellaPower':\n      'Stella Power',":
                  "'stellaPower':\n      'Stellan voima',",

              "'stellaMining':\n      'Stella Mining',":
                  "'stellaMining':\n      'Stellan louhinta',",

              "'powerBoost':\n      'Stella Power Boost',":
                  "'powerBoost':\n      'Stellan Power Boost',",

              "'powerBoostReward':\n      'Stella Power Boost: +{amount} HR',":
                  "'powerBoostReward':\n      'Stellan Power Boost: +{amount} HR',",
          }

          changed = False

          for old, new in replacements.items():
              if old in content:
                  content = content.replace(old, new, 1)
                  changed = True

          additions = {
              "accountDeletionAppTitle":
                  "Stelluriini-tilin poistaminen",

              "dailyMiningPowerBoost":
                  "Päivittäinen louhintavoiman tehostus",

              "dailyMiningPowerBoostShort":
                  "Louhintavoiman tehostus",

              "done":
                  "✓ VALMIS",

              "claiming":
                  "KERÄTÄÄN...",

              "claimHashRate":
                  "KERÄÄ +1 HASH RATE",

              "comeBackTomorrow":
                  "Palaa huomenna hakemaan lisää Hash Ratea 🐱",

              "claimDailyBonusInfo":
                  "Kerää päivittäinen bonus kasvattaaksesi louhintavoimaa",

              "footerMiningFuture":
                  "Stella louhii tulevaisuutta.",
          }

          missing_entries = []

          for key, value in additions.items():
              key_marker = f"'{key}':"

              if key_marker not in content:
                  missing_entries.append(
                      f"  '{key}':\n"
                      f"      '{value}',\n"
                  )

          if missing_entries:
              insert_text = (
                  "\n"
                  "  // ============================================================\n"
                  "  // 🌟 ADDITIONAL LOCALIZATION\n"
                  "  // ============================================================\n"
                  "\n"
                  + "\n".join(missing_entries)
              )

              final_marker = "\n};"

              if final_marker not in content:
                  raise RuntimeError(
                      "Could not find final localization map marker."
                  )

              content = content.replace(
                  final_marker,
                  insert_text + final_marker,
                  1,
              )

              changed = True

          path.write_text(
              content,
              encoding="utf-8",
          )

          print("Finnish localization updated successfully.")
          print(f"Changes made: {changed}")

      - name: Verify Finnish localization
        run: |
          echo "Checking Finnish localization..."

          grep -n "stellaPower" lib/localization/languages/fi.dart
          grep -n "stellaMining" lib/localization/languages/fi.dart
          grep -n "powerBoost" lib/localization/languages/fi.dart
          grep -n "footerMiningFuture" lib/localization/languages/fi.dart
          grep -n "accountDeletionAppTitle" lib/localization/languages/fi.dart
          grep -n "dailyMiningPowerBoost" lib/localization/languages/fi.dart
          grep -n "claimHashRate" lib/localization/languages/fi.dart

          echo "Finnish localization verification completed."

      - name: Check formatting
        run: |
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Show changes
        run: |
          git status --short
          git diff -- lib/localization/languages/fi.dart

      - name: Commit and push changes
        run: |
          if git diff --quiet -- lib/localization/languages/fi.dart; then
            echo "No Finnish localization changes were necessary."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib/localization/languages/fi.dart

          git commit -m "Fix Finnish UI localization"

          git push