name: Deploy Stelluriini Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy-functions:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==========================================
      # CHECK NODE VERSION
      # ==========================================

      - name: Check Node version
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version


      # ==========================================
      # CHECK PROJECT FILES
      # ==========================================

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la

          echo ""
          echo "Functions directory:"

          if [ -d "functions" ]; then
            ls -la functions
          else
            echo "ERROR: functions directory not found!"
            exit 1
          fi


      # ==========================================
      # INSTALL FIREBASE CLI
      # ==========================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools


      # ==========================================
      # INSTALL FUNCTIONS DEPENDENCIES
      # ==========================================

      - name: Install Functions dependencies
        working-directory: functions
        run: |
          npm install


      # ==========================================
      # AUTHENTICATE GOOGLE CLOUD
      # ==========================================

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ==========================================
      # SETUP GOOGLE CLOUD SDK
      # ==========================================

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2


      # ==========================================
      # CHECK GOOGLE PROJECT
      # ==========================================

      - name: Check Google project
        run: |
          gcloud config set project stelluriini

          echo ""
          echo "========================================"
          echo "GOOGLE CLOUD PROJECT"
          echo "========================================"

          gcloud config get-value project

          echo "========================================"


      # ==========================================
      # DEPLOY FUNCTIONS
      # ==========================================

      - name: Deploy Firebase Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYING STELLURIINI FUNCTIONS"
          echo "========================================"
          echo ""

          firebase deploy \
            --only functions \
            --project stelluriini \
            --non-interactive \
            --force


      # ==========================================
      # LIST FUNCTIONS
      # ==========================================

      - name: List deployed Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYED FUNCTIONS"
          echo "========================================"
          echo ""

          firebase functions:list \
            --project stelluriini


      # ==========================================
      # GET ADMOB REWARD URL
      # ==========================================

      - name: Get AdMob Reward URL
        run: |
          echo ""
          echo "========================================"
          echo "ADMOB REWARD FUNCTION URL"
          echo "========================================"
          echo ""

          firebase functions:describe adMobReward \
            --project stelluriini \
            --gen 2 \
            --format="value(serviceConfig.uri)"

          echo ""

          echo "========================================"
          echo "COPY THE URL ABOVE"
          echo "========================================"