name: Deploy Stelluriini Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  deploy-functions:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json


      # ======================================================
      # INSTALL FIREBASE CLI
      # ======================================================

      - name: Install Firebase CLI
        run: |

          npm install -g firebase-tools


      # ======================================================
      # INSTALL FUNCTION DEPENDENCIES
      # ======================================================

      - name: Install Functions dependencies
        working-directory: functions

        run: |

          npm ci


      # ======================================================
      # AUTHENTICATE GOOGLE CLOUD
      # ======================================================

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2

        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ======================================================
      # DEPLOY FUNCTIONS
      # ======================================================

      - name: Deploy Firebase Functions

        run: |

          firebase deploy \
            --only functions \
            --project stelluriini \
            --non-interactive


      # ======================================================
      # LIST FUNCTIONS
      # ======================================================

      - name: List deployed Functions

        run: |

          firebase functions:list \
            --project stelluriini


      # ======================================================
      # GET ADMOB FUNCTION URL
      # ======================================================

      - name: Get AdMob Reward URL

        run: |

          echo ""
          echo "========================================"
          echo "ADMOB REWARD FUNCTION URL"
          echo "========================================"
          echo ""

          firebase functions:describe adMobReward \
            --project stelluriini \
            --gen 2 \
            --format="value(serviceConfig.uri)"

          echo ""
          echo "========================================"
          echo "COPY THE URL ABOVE TO ADMOB"
          echo "========================================"