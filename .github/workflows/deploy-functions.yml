name: Deploy Stelluriini Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ==========================================
      # 3. INSTALL FIREBASE CLI
      # ==========================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools


      # ==========================================
      # 4. AUTHENTICATE GOOGLE CLOUD
      # ==========================================

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'


      # ==========================================
      # 5. SETUP GOOGLE CLOUD CLI
      # ==========================================

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: stelluriini


      # ==========================================
      # 6. INSTALL FUNCTIONS DEPENDENCIES
      # ==========================================

      - name: Install Functions dependencies
        working-directory: functions
        run: |
          npm install


      # ==========================================
      # 7. DEPLOY FIREBASE FUNCTIONS
      # ==========================================

      - name: Deploy Firebase Functions
        run: |
          firebase deploy \
            --only functions \
            --project stelluriini \
            --force


      # ==========================================
      # 8. LIST ALL FUNCTIONS
      # ==========================================

      - name: List Firebase Functions
        run: |
          firebase functions:list \
            --project stelluriini


      # ==========================================
      # 9. SHOW ADMOB REWARD FUNCTION URL
      # ==========================================

      - name: Show adMobReward URL
        run: |
          echo ""
          echo "=========================================="
          echo "ADMOB REWARD FUNCTION URL"
          echo "=========================================="
          echo ""

          URL=$(gcloud functions describe adMobReward \
            --gen2 \
            --region=us-central1 \
            --project=stelluriini \
            --format="value(serviceConfig.uri)")

          echo "$URL"

          echo ""
          echo "=========================================="
          echo "COPY THE URL ABOVE TO ADMOB"
          echo "=========================================="