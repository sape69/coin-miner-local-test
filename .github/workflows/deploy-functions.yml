name: Deploy Stelluriini Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy-functions:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json


      # ==========================================
      # CHECK NODE VERSION
      # ==========================================

      - name: Check Node version
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version


      # ==========================================
      # INSTALL FIREBASE CLI
      # ==========================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools


      # ==========================================
      # INSTALL FUNCTION DEPENDENCIES
      # ==========================================

      - name: Install Functions dependencies
        working-directory: functions
        run: |
          npm ci


      # ==========================================
      # AUTHENTICATE GOOGLE CLOUD
      #
      # GitHub Secret required:
      # GCP_SERVICE_ACCOUNT
      # ==========================================

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}


      # ==========================================
      # SETUP GOOGLE CLOUD SDK
      # ==========================================

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2


      # ==========================================
      # CHECK GOOGLE PROJECT
      # ==========================================

      - name: Check Google project
        run: |
          gcloud config set project stelluriini

          echo ""
          echo "========================================"
          echo "GOOGLE CLOUD PROJECT"
          echo "========================================"

          gcloud config get-value project

          echo "========================================"


      # ==========================================
      # CHECK FIREBASE PROJECT
      # ==========================================

      - name: Check Firebase project
        run: |
          firebase projects:list


      # ==========================================
      # DEPLOY FIREBASE FUNCTIONS
      #
      # --force automatically creates the Artifact
      # Registry cleanup policy.
      # ==========================================

      - name: Deploy Firebase Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYING STELLURIINI FUNCTIONS"
          echo "========================================"
          echo ""

          firebase deploy \
            --only functions \
            --project stelluriini \
            --non-interactive \
            --force


      # ==========================================
      # LIST DEPLOYED FUNCTIONS
      # ==========================================

      - name: List deployed Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYED FIREBASE FUNCTIONS"
          echo "========================================"
          echo ""

          firebase functions:list \
            --project stelluriini


      # ==========================================
      # GET ADMOB REWARD URL
      # ==========================================

      - name: Get AdMob Reward URL
        run: |
          echo ""
          echo "========================================"
          echo "ADMOB REWARD FUNCTION URL"
          echo "========================================"
          echo ""

          firebase functions:describe adMobReward \
            --project stelluriini \
            --gen 2 \
            --format="value(serviceConfig.uri)"

          echo ""

          echo "========================================"
          echo "COPY THE URL ABOVE TO ADMOB"
          echo "========================================"