
name: Deploy Stelluriini Functions

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node version
        run: |
          echo "========================================"
          echo "NODE VERSION"
          echo "========================================"
          node --version
          npm --version

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check Functions files
        run: |
          echo "========================================"
          echo "REPOSITORY FILES"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "FUNCTIONS FOLDER"
          echo "========================================"
          ls -la functions

          echo ""
          echo "========================================"
          echo "FUNCTIONS PACKAGE.JSON"
          echo "========================================"
          cat functions/package.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Check JavaScript syntax
        working-directory: functions
        run: |
          set -e

          echo "========================================"
          echo "CHECKING JAVASCRIPT SYNTAX"
          echo "========================================"

          find . \
            -type d -name node_modules -prune \
            -o \
            -type f -name "*.js" -print0 \
            | xargs -0 -r -n 1 node --check

          echo ""
          echo "SUCCESS: All JavaScript files passed syntax checks."

      - name: Check Google Cloud Storage dependency
        working-directory: functions
        run: |
          echo "========================================"
          echo "GOOGLE CLOUD STORAGE DEPENDENCY"
          echo "========================================"

          npm ls @google-cloud/storage --all || true

          node -e "
          try {
            const pkg = require('@google-cloud/storage/package.json');
            console.log('Installed version:', pkg.version);
          } catch (error) {
            console.log('Package is not directly resolvable.');
            console.log('It may be absent or nested inside another dependency.');
          }
          "

          echo "Dependency check completed."

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: stelluriini

      - name: Check Google project
        run: |
          echo "========================================"
          echo "GOOGLE CLOUD PROJECT"
          echo "========================================"

          gcloud config set project stelluriini
          gcloud config get-value project

      - name: Deploy Firebase Functions
        run: |
          firebase deploy \
            --only functions \
            --project stelluriini \
            --non-interactive \
            --force

      - name: List deployed Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYED FIREBASE FUNCTIONS"
          echo "========================================"

          firebase functions:list \
            --project stelluriini

          echo ""

      - name: Get AdMob Reward Function URL
        run: |
          echo ""
          echo "========================================"
          echo "ADMOB REWARD FUNCTION URL"
          echo "========================================"

          gcloud functions describe adMobReward \
            --gen2 \
            --region us-central1 \
            --project stelluriini \
            --format="value(serviceConfig.uri)"

          echo ""
          echo "========================================"
          echo "COPY THE URL ABOVE TO ADMOB"
          echo "========================================"
