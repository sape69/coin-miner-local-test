name: Deploy Stelluriini Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # INSTALL FIREBASE CLI
      # ==========================================

      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      # ==========================================
      # GOOGLE CLOUD CREDENTIALS
      # ==========================================

      - name: Create Google Cloud credentials
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > "$GITHUB_WORKSPACE/gcp-key.json"


      # ==========================================
      # INSTALL FUNCTIONS DEPENDENCIES
      # ==========================================

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install


      # ==========================================
      # DEPLOY FIREBASE FUNCTIONS
      # ==========================================

      - name: Deploy Firebase Functions
        run: |
          firebase deploy \
            --only functions \
            --project stelluriini \
            --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json


      # ==========================================
      # SHOW DEPLOYED FUNCTIONS
      # ==========================================

      - name: Show deployed Functions
        run: |
          firebase functions:list \
            --project stelluriini
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json


      # ==========================================
      # CLEAN UP SECRET FILE
      # ==========================================

      - name: Remove credentials
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/gcp-key.json"