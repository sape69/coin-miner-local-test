name: Deploy Stelluriini Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy-functions:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # SETUP NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"


      # ==========================================
      # CHECK NODE VERSION
      # ==========================================

      - name: Check Node version
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version


      # ==========================================
      # INSTALL FIREBASE CLI
      # ==========================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools


      # ==========================================
      # INSTALL FUNCTIONS DEPENDENCIES
      # ==========================================

      - name: Install Functions dependencies
        working-directory: functions
        run: |
          npm ci


      # ==========================================
      # AUTHENTICATE GOOGLE CLOUD
      # ==========================================

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}


      # ==========================================
      # SETUP GOOGLE CLOUD SDK
      # ==========================================

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: stelluriini


      # ==========================================
      # CHECK GOOGLE PROJECT
      # ==========================================

      - name: Check Google project
        run: |
          echo "Current Google Cloud project:"

          gcloud config set project stelluriini

          gcloud config get-value project


      # ==========================================
      # DEPLOY FIREBASE FUNCTIONS
      # ==========================================

      - name: Deploy Firebase Functions
        run: |
          firebase deploy \
            --only functions \
            --project stelluriini \
            --non-interactive \
            --force


      # ==========================================
      # LIST DEPLOYED FUNCTIONS
      # ==========================================

      - name: List deployed Functions
        run: |
          echo ""
          echo "========================================"
          echo "DEPLOYED FIREBASE FUNCTIONS"
          echo "========================================"
          echo ""

          firebase functions:list \
            --project stelluriini

          echo ""


      # ==========================================
      # GET ADMOB REWARD FUNCTION URL
      # ==========================================

      - name: Get AdMob Reward Function URL
        run: |
          echo ""
          echo "========================================"
          echo "ADMOB REWARD FUNCTION URL"
          echo "========================================"
          echo ""

          gcloud functions describe adMobReward \
            --gen2 \
            --region us-central1 \
            --project stelluriini \
            --format="value(serviceConfig.uri)"

          echo ""

          echo "========================================"
          echo "COPY THE URL ABOVE TO ADMOB"
          echo "========================================"
          echo ""