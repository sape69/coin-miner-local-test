
name: Deploy Stelluriini Firestore Indexes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-indexes:
    name: Deploy Firestore Indexes Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: stelluriini

      - name: Verify Firebase configuration
        run: |
          test -f firebase.json
          test -f firestore.indexes.json
          echo "Firebase configuration files found."

      - name: Deploy Firestore indexes only
        run: |
          firebase deploy \
            --only firestore:indexes \
            --project stelluriini \
            --non-interactive

      - name: Deployment completed
        run: echo "Firestore indexes deployment completed."
