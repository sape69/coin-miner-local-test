
name: Check Stelluriini Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/check-functions.yml"

  pull_request:
    branches:
      - main
    paths:
      - "functions/**"
      - ".github/workflows/check-functions.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-functions:
    name: Validate Firebase Functions
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Node, npm and Java
        run: |
          node --version
          npm --version
          java -version

      - name: Install Functions dependencies
        run: npm install --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          set -eu

          find src test \
            -type f \
            -name "*.js" \
            -print0 \
            | xargs -0 -r -n 1 node --check

          if [ -f index.js ]; then
            node --check index.js
          fi

          echo "All JavaScript files passed syntax validation."

      - name: Verify required referral files
        run: |
          set -eu

          test -f src/services/referralService.js
          test -f src/services/referralBonusSummaryService.js
          test -f src/functions/referralFunctions.js

          test -f test/referralBonusSummaryService.test.js
          test -f test/referralBonusSummaryService.integration.test.js
          test -f test/referralMiningReward.integration.test.js
          test -f test/referralFunctions.integration.test.js
          test -f test/referralRelationship.integration.test.js
          test -f test/referralCallable.integration.test.js

          echo "All required referral files exist."

      - name: Run referral summary unit tests
        run: |
          node --test test/referralBonusSummaryService.test.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version
        working-directory: .

      - name: Run referral summary integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-stelluriini \
            "cd functions && node --test test/referralBonusSummaryService.integration.test.js"
        working-directory: .

      - name: Run referral mining reward integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-stelluriini \
            "cd functions && node --test test/referralMiningReward.integration.test.js"
        working-directory: .

      - name: Run referral functions integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-stelluriini \
            "cd functions && node --test test/referralFunctions.integration.test.js"
        working-directory: .

      - name: Run referral relationship integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-stelluriini \
            "cd functions && node --test test/referralRelationship.integration.test.js"
        working-directory: .

      - name: Run referral callable integration tests
        run: |
          firebase emulators:exec \
            --only firestore \
            --project demo-stelluriini \
            "cd functions && node --test test/referralCallable.integration.test.js"
        working-directory: .

      - name: Verify installed dependencies
        run: npm ls --depth=0
