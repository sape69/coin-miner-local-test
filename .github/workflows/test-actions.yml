name: Test GitHub Actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test runner
        run: echo "GitHub Actions runner works!"

      - name: Test Python
        shell: python
        run: |
          print("Python works!")

      - name: Test complete
        run: echo "TEST COMPLETED"