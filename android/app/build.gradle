
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: "com.google.gms.google-services"

// ============================================================
// 🐱 STELLURIINI - RELEASE SIGNING
// ============================================================

def stelluriiniKeystoreFile =
        file("../stelluriini-upload-keystore.jks")

def stelluriiniKeystorePassword =
        System.getenv("STELLURIINI_KEYSTORE_PASSWORD")

def stelluriiniKeyPassword =
        System.getenv("STELLURIINI_KEY_PASSWORD")

android {
    namespace = "com.stelluriini.app"

    compileSdk = 36

    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.stelluriini.app"

        minSdk = 23
        targetSdk = 36

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            storeFile = stelluriiniKeystoreFile
            storePassword = stelluriiniKeystorePassword
            keyAlias = "stelluriini-upload"
            keyPassword = stelluriiniKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            // R8: poista käyttämätön koodi.
            minifyEnabled true

            // Poista käyttämättömät Android-resurssit.
            shrinkResources true

            // Androidin optimoidut oletussäännöt.
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            )
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source = "../.."
}
