plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: "com.google.gms.google-services"

// ============================================================
// 🐱 STELLURIINI - RELEASE SIGNING
// ============================================================
//
// Release-keystore ladataan GitHub Actionsissa ennen buildia.
//
// Keystore:
// android/stelluriini-upload-keystore.jks
//
// Alias:
// stelluriini-upload
//
// Salasanat tulevat GitHub Secrets -muuttujista:
// STELLURIINI_KEYSTORE_PASSWORD
// STELLURIINI_KEY_PASSWORD
//
// Salasanoja EI tallenneta tähän tiedostoon.
// ============================================================

def stelluriiniKeystoreFile =
        file("../stelluriini-upload-keystore.jks")

def stelluriiniKeystorePassword =
        System.getenv("STELLURIINI_KEYSTORE_PASSWORD")

def stelluriiniKeyPassword =
        System.getenv("STELLURIINI_KEY_PASSWORD")

android {
    namespace = "com.stelluriini.app"

    compileSdk = 36

    // ==========================================================
    // 🐱 STELLURIINI - ANDROID NDK
    // ==========================================================
    //
    // Firebase- ja flutter_local_notifications-pluginit
    // vaativat NDK 27.0.12077973.
    //

    ndkVersion = "27.0.12077973"

    // ==========================================================
    // 🐱 JAVA / CORE LIBRARY DESUGARING
    // ==========================================================
    //
    // flutter_local_notifications vaatii core library
    // desugaringin käyttöön.
    //

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId = "com.stelluriini.app"

        minSdk = 23
        targetSdk = 36

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ==========================================================
    // 🐱 STELLURIINI RELEASE SIGNING
    // ==========================================================

    signingConfigs {
        release {
            storeFile = stelluriiniKeystoreFile
            storePassword = stelluriiniKeystorePassword
            keyAlias = "stelluriini-upload"
            keyPassword = stelluriiniKeyPassword
        }
    }

    // ==========================================================
    // BUILD TYPES
    // ==========================================================

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// ============================================================
// 🐱 BUILT-IN KOTLIN
// ============================================================
//
// AGP 9 + Flutter 3.47:
// Kotlin Gradle Plugin (org.jetbrains.kotlin.android)
// ei ole enää app-moduulissa käytössä.
//
// Kotlin käyttää nyt Flutter/AGP:n built-in Kotlin -tukea.
//
// ============================================================

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// ============================================================
// 🐱 CORE LIBRARY DESUGARING
// ============================================================
//
// flutter_local_notifications käyttää Java 8+ API-ominaisuuksia,
// joten Android Gradle Plugin tarvitsee tämän riippuvuuden.
//
// ============================================================

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source = "../.."
}