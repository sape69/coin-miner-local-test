
name: stelluriini
description: STELLURIINI Android app

publish_to: "none"

version: 1.0.20+22

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase - BoM 5.2.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  cloud_functions: ^7.1.0
  firebase_analytics: ^13.1.0

  # Google Mobile Ads
  google_mobile_ads: ^6.0.0

  # Google Play Billing - Premium subscriptions
  in_app_purchase: ^3.3.1

  # Local storage
  shared_preferences: ^2.5.3

  # URLs
  url_launcher: ^6.3.2

  # Native sharing
  share_plus: ^12.0.2

  # App information
  package_info_plus: ^8.3.1

  # Local notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Android app icon generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/stella_world/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/stelluriini_logo.png"
  adaptive_icon_background: "#120B24"
  adaptive_icon_foreground: "assets/images/stelluriini_logo.png"
