name: stelluriini
description: STELLURIINI Android app

publish_to: "none"

version: 1.0.8+10

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_analytics: ^12.0.0

  # Google Mobile Ads
  google_mobile_ads: ^6.0.0

  # Local storage
  shared_preferences: ^2.5.3

  # URLs
  url_launcher: ^6.3.1

  # App information
  package_info_plus: ^8.3.1

  # Local notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Android app icon generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/stelluriini_logo.png"
  adaptive_icon_background: "#120B24"
  adaptive_icon_foreground: "assets/images/stelluriini_logo.png"