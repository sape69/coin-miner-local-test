name: stelluriini
description: STELLURIINI Android app

publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  firebase_analytics: ^12.0.0

  # Google Mobile Ads
  google_mobile_ads: ^6.0.0

  # Local storage
  shared_preferences: ^2.5.3

  # URLs
  url_launcher: ^6.3.1

  # App information
  package_info_plus: ^8.3.1

  # Local notifications
  # Used for the 24-hour mining completion reminder.
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/stella/